[metadata]
name = mariamem
description = Disposable, in-memory MariaDB for tests
license = GPL-2.0-only
license_files =
    LICENSE
    NOTICE
    THIRD_PARTY_LICENSES
    licenses/*
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: GNU General Public License v2 (GPLv2)

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.package_data]
mariamem = _native/*

[options.extras_require]
pytest = pytest>=7
test =
    pytest>=7
    pytest-xdist>=3
    PyMySQL>=1.1,<2

[options.entry_points]
pytest11 =
    mariamem = mariamem.pytest_plugin

name: Prepared lexer C input and translation (not acceptance)
on:
  push:
    branches: [experiment/lexer-candidate]
    paths:
      - guest/experimental.patch
      - benchmarks/lexercandidate/**
      - .github/workflows/lexer-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    timeout-minutes: 100
    steps:
      - name: Source builder dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Bind exact source, independently replay C producer and build once
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p build/lexer-ci
          python3 scripts/git_identity.py inspect HEAD > build/lexer-ci/source.json
          python3 -c 'import json,os;assert json.load(open("build/lexer-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          python3 -m unittest discover -s benchmarks/lexercandidate -p test_candidate.py -v
          python3 scripts/check_public.py
          python3 benchmarks/lexercandidate/fetch_source.py --output build/lexer-ci/temp/pristine
          python3 benchmarks/lexercandidate/c_source.py --check --work-dir build/lexer-ci > build/lexer-ci/c-replay.txt 2>&1
          python3 scripts/build_generated_guest.py --development-output /tmp/lexer-guest > build/lexer-ci/guest-build.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lexer-candidate-guest-${{ github.sha }}
          path: /tmp/lexer-guest
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: lexer-candidate-build-${{ github.sha }}
          path: |
            build/lexer-ci/*.json
            build/lexer-ci/*.txt
            build/lexer-ci/evidence
          if-no-files-found: error
          retention-days: 7
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: test
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Native MariaDB 12.3.3 lexical SQL reference
        run: |
          python -m pip install PyMySQL==1.2.3
          mkdir -p build/lexer-native
          python scripts/git_identity.py inspect HEAD > build/lexer-native/source.json
          python -c 'import json,os;assert json.load(open("build/lexer-native/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          docker image inspect mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1 --format '{{json .}}' > build/lexer-native/image.json
          python benchmarks/lexercandidate/sql_acceptance.py --native-port 3307 --output build/lexer-native/native.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lexer-candidate-reference-${{ github.sha }}
          path: build/lexer-native
          if-no-files-found: error
          retention-days: 7
  translation:
    needs: [guest, reference]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    env:
      GOTOOLCHAIN: go1.26.10
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lexer-candidate-guest-${{ github.sha }}
          path: ${{ runner.temp }}/lexer-guest
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lexer-candidate-reference-${{ github.sha }}
          path: build/lexer-reference
      - name: Acquire exact C guest translation; fixed runtime binding review remains
        run: |
          python -c 'import platform,os;expected=("Darwin","arm64") if os.environ["RUNNER_OS"]=="macOS" else ("Linux","x86_64");assert (platform.system(),platform.machine())==expected'
          mkdir -p build/lexer-ci
          python benchmarks/lexercandidate/ci_translate.py --guest "$RUNNER_TEMP/lexer-guest" --output "$RUNNER_TEMP/lexer-translation" --receipt build/lexer-ci > build/lexer-ci/translation.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: lexer-candidate-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/lexer-ci
            ${{ runner.temp }}/lexer-translation/translation/input-manifest.json
            ${{ runner.temp }}/lexer-translation/translation/module/generated
          if-no-files-found: error
          retention-days: 7

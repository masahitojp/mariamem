name: Development checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      check_scope: ${{ steps.diff.outputs.check_scope }}
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - id: diff
        run: python scripts/development_scope.py --candidate-sha '${{ github.sha }}' --github-output
  check:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          filter: blob:none
          fetch-depth: 0 # Fixture acceptance binds the reviewed design ancestor.
      - if: needs.scope.outputs.check_scope == 'full'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/check.yml
            scripts/vet_generated.py
      - name: Share Go compiler cache and discard restored test results
        if: needs.scope.outputs.check_scope == 'full'
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - if: needs.scope.outputs.check_scope != 'docs'
        run: python -m pip install -r tests/routing_acceptance/unit-requirements.txt
      - run: python scripts/verify.py check --scope '${{ needs.scope.outputs.check_scope }}'

  integration:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    # Representative source smoke only; full integration belongs to Release CI.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/check.yml
            scripts/verify.py
      - name: Share Go compiler cache and discard restored test results
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - run: python -m pip install PyMySQL==1.2.3
      - run: python scripts/verify.py smoke

  required:
    name: Live required gate
    if: always()
    needs: [scope, check, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Require daily source checks and selected integration including Live smoke
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PYTHONPATH: scripts
        run: python3 -c 'import json, os; from development_scope import verify_gate; verify_gate(json.loads(os.environ["NEEDS_JSON"]))'

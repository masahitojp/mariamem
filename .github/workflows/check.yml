name: Development checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      check_scope: ${{ steps.diff.outputs.check_scope }}
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - id: diff
        run: python scripts/development_scope.py --candidate-sha '${{ github.sha }}' --github-output
  check:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: needs.scope.outputs.check_scope == 'full'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/check.yml
            scripts/vet_generated.py
      - name: Share Go compiler cache and discard restored test results
        if: needs.scope.outputs.check_scope == 'full'
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - if: needs.scope.outputs.check_scope != 'docs'
        run: python -m pip install -r tests/routing_acceptance/unit-requirements.txt
      - run: python scripts/verify.py check --scope '${{ needs.scope.outputs.check_scope }}'

  integration:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    # Cold race and ordinary builds share this job budget; test deadlines remain in verify.py.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/check.yml
            scripts/verify.py
      - name: Share Go compiler cache and discard restored test results
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/routing_acceptance/unit-requirements.txt mysql-connector-python==26.7.0
      - run: python scripts/verify.py integration

  worker-failure-native:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['33315:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install PyMySQL==1.2.3
      - name: Fresh native duplicate-removal reference
        run: python tests/text_dedup_acceptance.py native --source-commit "$GITHUB_SHA" --native-image mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e --output build/worker-failure/native.json
      - name: Fresh native ordinary SQL reference (one-minute budget)
        timeout-minutes: 1
        run: python tests/text_dedup_acceptance.py native --suite ordinary --source-commit "$GITHUB_SHA" --native-image mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e --output build/worker-failure/ordinary-native.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: worker-failure-native-${{ github.sha }}
          path: build/worker-failure
          if-no-files-found: error

  worker-failure:
    needs: [scope, worker-failure-native]
    if: needs.scope.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Keep the PR macOS slot consolidated in Live; main/manual retain both hosts.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/check.yml
            scripts/runtime_failure.py
      - name: Share Go compiler cache and discard restored test results
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install pytest PyMySQL==1.2.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: worker-failure-native-${{ github.sha }}
          path: build/worker-failure/reference
      - name: Source identity and host ownership races
        run: |
          python scripts/git_identity.py inspect HEAD
          go test -race -p 1 ./internal/generatedgo/code/base ./internal/generatedgo ./internal/guest ./internal/mysqlwire -count=1
      - name: Actual generated worker trap and independent DB survival
        run: go test -p 1 -tags=integration ./internal/generatedgo -run TestWorkerTrapActualGuest -count=1 -timeout=3m
      - name: Exact-source host and native equality
        run: |
          go build -p 1 -trimpath -o build/worker-failure/mariamem-host ./cmd/mariamem-host
          python tests/text_dedup_acceptance.py guest --source-commit "$GITHUB_SHA" --host build/worker-failure/mariamem-host --reference build/worker-failure/reference/native.json --output build/worker-failure/guest.json
      - name: Ordinary SQL native/guest comparison (one-minute budget)
        timeout-minutes: 1
        run: python tests/text_dedup_acceptance.py guest --suite ordinary --source-commit "$GITHUB_SHA" --host build/worker-failure/mariamem-host --reference build/worker-failure/reference/ordinary-native.json --output build/worker-failure/ordinary-guest.json
      - name: Wire regression and Snapshot/Fork after mapped temporary-table use
        env:
          MARIAMEM_TEST_DEFAULT: '1'
          MARIAMEM_TEST_HOST: build/worker-failure/mariamem-host
          PYTHONPATH: python
        run: python -m pytest tests/test_python_wire.py tests/test_owned_snapshot.py -k 'text_blob_duplicate or duplicate_removal_mapping' -q
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: worker-failure-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/worker-failure/guest.json
            build/worker-failure/ordinary-guest.json
            build/worker-failure/reference/ordinary-native.json
            build/worker-failure/reference/native.json
          if-no-files-found: warn

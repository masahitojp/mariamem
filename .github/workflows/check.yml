name: Development checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      integration: ${{ steps.diff.outputs.integration }}
      linux_wheel: ${{ steps.diff.outputs.linux_wheel }}
      smoke_result: ${{ steps.smoke.outcome }}
    steps:
      # One checkout owns selection, source checks and representative smoke.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          filter: blob:none
          fetch-depth: 0 # Diff and fixture ancestry checks require commit history.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - id: diff
        run: python scripts/development_scope.py --candidate-sha '${{ github.sha }}' --github-output
      - if: steps.diff.outputs.check_scope == 'full'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
          # Go invalidates compiled packages by their inputs. Workflow edits
          # must not discard the compiler cache; cached test PASS is never reused.
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Share Go compiler cache and discard restored test results
        if: steps.diff.outputs.check_scope == 'full'
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - if: steps.diff.outputs.check_scope != 'docs'
        run: python -m pip install -r tests/routing_acceptance/unit-requirements.txt
      - run: python scripts/verify.py check --scope '${{ steps.diff.outputs.check_scope }}' --profile daily
      - name: Check Snapshot protocol models with TLC
        if: steps.diff.outputs.snapshot_model == 'true'
        timeout-minutes: 2
        shell: bash
        env:
          TLC_SHA256: fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713
        run: |
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl --fail --silent --show-error --location --max-time 45 \
            -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          printf '%s  %s\n' "$TLC_SHA256" "$jar" | sha256sum --check
          sh tests/formal/snapshot/check.sh "$jar"
      - name: Check current release notes heading
        if: steps.diff.outputs.check_release_notes == 'true'
        run: python scripts/check_development_docs.py --release-notes
      - name: Check Python README packaging metadata
        if: steps.diff.outputs.check_python_readme == 'true'
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 twine
          python scripts/check_development_docs.py --python-readme
      - name: Check retained v0.4.7 benchmark evidence checksums
        if: steps.diff.outputs.check_v047_evidence == 'true'
        run: python scripts/check_development_docs.py --v047-evidence
      - id: smoke
        name: Representative runtime smoke using the source-check compiler cache
        if: steps.diff.outputs.integration == 'true'
        run: python scripts/verify.py smoke

  integration:
    # Keep the protected context; the actual smoke ran on the check runner.
    needs: check
    if: always() && needs.check.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful source checks and actual smoke
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SMOKE_RESULT: ${{ needs.check.outputs.smoke_result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$SMOKE_RESULT" = success

  linux:
    needs: check
    if: needs.check.outputs.linux_wheel == 'true'
    uses: ./.github/workflows/linux-wheel.yml

  required:
    name: Live required gate
    if: always()
    needs: [check, integration, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require daily source checks and selected smoke
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # Inspect only job metadata: no checkout or toolchain setup for a gate.
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          assert set(needs) == {'check', 'integration', 'linux'}, 'missing development dependency'
          assert needs['check']['result'] == 'success', 'source checks failed'
          outputs = needs['check']['outputs']
          selected = outputs.get('integration')
          assert selected in ('true', 'false'), 'invalid smoke selection'
          expected = 'success' if selected == 'true' else 'skipped'
          assert outputs.get('smoke_result') == expected, 'smoke did not finish as selected'
          assert needs['integration']['result'] == expected, 'integration context did not finish as selected'
          linux = outputs.get('linux_wheel')
          assert linux in ('true', 'false'), 'invalid Linux wheel selection'
          expected_linux = 'success' if linux == 'true' else 'skipped'
          assert needs['linux']['result'] == expected_linux, 'Linux wheel checks did not finish as selected'
          PY

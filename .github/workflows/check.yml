name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - run: python3 scripts/check_public.py
      - run: python3 -m unittest discover -s tests -p 'test_release_tools.py'
      - run: python3 -m unittest discover -s tests -p 'test_native_package.py'
      - run: python3 -m unittest discover -s tests -p 'test_runtime_sources.py'
      - run: python3 -m unittest discover -s tests -p 'test_guest_provenance.py'
      - run: python3 -m unittest discover -s tests -p 'test_runtime_notices.py'
      - run: python3 scripts/runtime_notices.py
      - run: python3 -m compileall -q scripts python/mariamem tests
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...

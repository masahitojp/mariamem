name: Narrow atomic native verification
on:
  push:
    branches: [experiment/v050-exact-writers-integration]
permissions:
  contents: read
jobs:
  ubuntu-narrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - name: Exact source and native environment
        run: |
          mkdir -p build/narrow-native-evidence
          python3 -c 'import platform;assert platform.system()=="Linux" and platform.machine()=="x86_64";d=dict(s.split("=",1) for s in open("/etc/os-release").read().splitlines() if "=" in s);assert d["ID"].strip(chr(34))=="ubuntu" and d["VERSION_ID"].strip(chr(34))=="24.04"'
          python3 scripts/git_identity.py inspect HEAD > build/narrow-native-evidence/source.json
          uname -a > build/narrow-native-evidence/platform.txt
          go version >> build/narrow-native-evidence/platform.txt
          node --version >> build/narrow-native-evidence/platform.txt
          python3 scripts/verify_generated_runtime.py
      - name: Real Wasm narrow-family reference and native heap/mmap checks
        run: |
          python3 -c 'import sys,json,pathlib;sys.path.insert(0,"scripts");from build_generated_guest import download;p=json.load(open("release/generated-go-toolchain.json"));download(p["archives"]["converter"],pathlib.Path("build/downloads"))'
          python3 scripts/runtime_correctness/narrow_fixture.py --converter-archive build/downloads/wasm2go-upstream.tar.gz --output build/narrow-native
      - name: Native production primitives and focused guest regressions
        env:
          MARIAMEM_TEST_DEFAULT: '1'
        run: |
          go test -race -p 1 ./internal/generatedgo/code/base -count=1 > build/narrow-native-evidence/base.txt 2>&1
          go test -p 1 -tags=integration ./tests/gointegration ./tests/godefault ./tests/generatedmemory -count=1 -timeout=5m > build/narrow-native-evidence/guest.txt 2>&1
      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: narrow-native-ubuntu-${{ github.sha }}
          path: |
            build/narrow-native-evidence
            build/narrow-native/results.json
            build/narrow-native/reference-results.json
            build/narrow-native/*.txt
          if-no-files-found: warn

name: Dump native acquisition preflight
on:
  push:
    branches: [experiment/dump-import]
    paths:
      - '.github/workflows/dump-import-spike.yml'
      - 'tests/dump_import_spike/linux_acquisition.py'
      - 'tests/dump_import_spike/linux-native-pin.json'
      - 'tests/dump_import_spike/test_linux_acquisition.py'
      - 'scripts/git_identity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Exact identity mutation controls
        run: python3 -m unittest discover -s tests/dump_import_spike -p test_linux_acquisition.py -v
      - name: Assert source and each native executable identity
        env:
          NATIVE_CONTAINER: ${{ job.services.mariadb.id }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 tests/dump_import_spike/linux_acquisition.py --container "$NATIVE_CONTAINER" --expected-source-commit "$EXPECTED_SOURCE_COMMIT" --output build/dump-preflight
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: dump-native-preflight-${{ github.sha }}
          path: build/dump-preflight
          if-no-files-found: error

name: Release candidate READY
run-name: '${{ inputs.operation }} -- ${{ inputs.label || inputs.candidate_ref }}'
on:
  workflow_dispatch:
    inputs:
      operation:
        description: READY evidence only, or one-shot qualification and publication
        required: true
        default: verify
        type: choice
        options: [verify, release, public-smoke-recovery]
      label:
        description: Display only (version -- short SHA); never used for identity
        required: false
        type: string
      notes:
        description: Optional tracked release-notes path
        required: false
        type: string
      mode:
        description: Advanced recovery override; normal releases use auto
        required: false
        default: auto
        type: choice
        options: [auto, full, acceptance-only, guard-only]
      candidate_run:
        description: Advanced recovery only — original frozen artifact run ID
        required: false
        type: string
      evidence_run:
        description: Advanced recovery only — exact acceptance evidence run ID
        required: false
        type: string
      candidate_ref:
        description: Remotely fetchable exact candidate (full 40-character SHA)
        required: true
        type: string
      smoke_ref:
        description: Advanced public-smoke recovery only — exact Go smoke repair commit
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    if: inputs.operation != 'public-smoke-recovery'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
      runtime_reused: ${{ steps.plan.outputs.runtime_reused }}
      features_reused: ${{ steps.plan.outputs.features_reused }}
      feature_run: ${{ steps.plan.outputs.feature_run }}
      candidate_run: ${{ steps.plan.outputs.candidate_run }}
      evidence_run: ${{ steps.plan.outputs.evidence_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - id: source
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          MODE: ${{ inputs.mode }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
        run: |
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$MODE" != auto ] && [ "$MODE" != full ]; then
            [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || exit 1
          fi
          if [ "$MODE" = guard-only ]; then
            [[ "$EVIDENCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          fi
          git fetch --no-tags origin "$CANDIDATE_REF"
          sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$sha" = "$CANDIDATE_REF"
          test "$(git cat-file -t "$sha")" = commit
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Exact generated-go-v1 candidate: $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          path: candidate-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - id: plan
        name: Automatically select authenticated READY reuse or full qualification
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          OPERATION: ${{ inputs.operation }}
          MODE: ${{ inputs.mode }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--root candidate-source --candidate-sha "$SOURCE_SHA" --operation "$OPERATION" --mode "$MODE")
          if [ -n "$CANDIDATE_RUN" ]; then args+=(--candidate-run "$CANDIDATE_RUN"); fi
          if [ -n "$EVIDENCE_RUN" ]; then args+=(--evidence-run "$EVIDENCE_RUN"); fi
          python scripts/release_plan.py "${args[@]}"
  units:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            pytest: '7.0.0'
          - python: '3.14'
            pytest: '9.0.2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'pytest==${{ matrix.pytest }}' -r tests/routing_acceptance/unit-requirements.txt
      - name: Shared pure policy, receipt and routing compatibility tests
        env:
          PYTHONPATH: python
        run: >-
          python -m pytest -q
          tests/test_routing.py tests/test_routing_pytest.py tests/test_routing_receipts.py
          tests/test_preparation_migration_acceptance.py
          tests/test_dump_ci_workflow.py tests/test_git_identity.py
          tests/test_dump_product_binding.py tests/test_dump_import_acceptance.py
  runtime:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: ubuntu24.04-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Share compiler cache, never cached test results
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Build the only release wheel for this platform
        if: needs.resolve.outputs.mode == 'full'
        run: |
          python scripts/git_identity.py inspect HEAD
          python scripts/verify_generated_runtime.py
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python scripts/build_alpha.py --ci-candidate
      - name: Restore authenticated frozen wheel without rebuild
        if: needs.resolve.outputs.mode != 'full'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_generated_ci.py restore-platform \
            --candidate-sha '${{ needs.resolve.outputs.source_sha }}' --platform '${{ matrix.platform }}' \
            --mode acceptance-only --candidate-run '${{ needs.resolve.outputs.candidate_run }}'
      - name: Verify the wheel and its embedded host before sharing
        run: python scripts/release_runtime.py --source-commit '${{ needs.resolve.outputs.source_sha }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-runtime-${{ matrix.runner }}-${{ needs.resolve.outputs.source_sha }}
          path: |
            build/dist/*.whl
            tests/evidence/alpha-wheel.json
          if-no-files-found: error
          retention-days: 14
  guest:
    if: needs.resolve.outputs.mode == 'full'
    needs: resolve
    # Build-host architecture preserves the accepted canonical LLVM23 recipe;
    # this does not extend product support to Linux arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install native build tools
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build bison pkg-config curl ca-certificates git \
            libssl-dev zlib1g-dev libpcre2-dev libncurses-dev xz-utils
      - name: Two independent canonical source to WASM builds
        run: |
          test "$(git rev-parse HEAD)" = '${{ needs.resolve.outputs.source_sha }}'
          sudo -H -E "$(command -v python)" scripts/build_generated_guest.py --repetitions 2
          sudo chown -R "$(id -u):$(id -g)" build
      - name: Reproduce generated Go and verify GPL source closure offline
        env:
          GOTOOLCHAIN: go1.26.10
        run: |
          python scripts/regenerate_release_guest.py
          python scripts/release_generated_ci.py source --candidate-sha '${{ needs.resolve.outputs.source_sha }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-generated-inputs-${{ needs.resolve.outputs.source_sha }}
          path: |
            build/generated-release/
            build/release/generated-source.json
            build/release/*-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 14
  candidate:
    if: needs.resolve.outputs.mode == 'full'
    needs: [resolve, guest, runtime]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: ubuntu24.04-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.10
          cache: false
      - id: compiler-paths
        if: needs.resolve.outputs.runtime_reused != 'true'
        name: Locate compiler and module caches
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
      - id: compiler-cache
        if: needs.resolve.outputs.runtime_reused != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: |
            ${{ steps.compiler-paths.outputs.build }}
            ${{ steps.compiler-paths.outputs.modules }}
          # Separate ownership from the wheel cache: save after race compilation.
          # Per-source keys let later candidates extend an immutable older cache.
          key: release-core-race-v1-${{ runner.os }}-${{ runner.arch }}-go1.26.10-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.resolve.outputs.source_sha }}
          restore-keys: |
            release-core-race-v1-${{ runner.os }}-${{ runner.arch }}-go1.26.10-${{ hashFiles('go.mod', 'go.sum') }}-
            release-core-race-v1-${{ runner.os }}-${{ runner.arch }}-go1.26.10-
      - name: Discard restored test results; keep compiler outputs
        if: needs.resolve.outputs.runtime_reused != 'true'
        run: go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-generated-inputs-${{ needs.resolve.outputs.source_sha }}
          path: build/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-runtime-${{ matrix.runner }}-${{ needs.resolve.outputs.source_sha }}
          path: .
      - name: Qualify and freeze the shared release wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_runtime.py --source-commit '${{ needs.resolve.outputs.source_sha }}'
          python -m pip install pytest==8.4.2 -r tests/routing_acceptance/unit-requirements.txt mysql-connector-python==26.7.0
          if [ '${{ needs.resolve.outputs.runtime_reused }}' = true ]; then
            python scripts/runtime_validation.py --candidate-sha '${{ needs.resolve.outputs.source_sha }}' \
              --output build/release/runtime-validation.json
            python scripts/release_preparation_checks.py
          else
            GOTOOLCHAIN=go1.26.10 python scripts/verify.py check
            GOTOOLCHAIN=go1.26.10 python scripts/verify.py integration --host build/mariamem-host
          fi
          python scripts/verify_generated_runtime.py
          python scripts/release_generated_ci.py freeze \
            --candidate-sha '${{ needs.resolve.outputs.source_sha }}' --platform '${{ matrix.platform }}' \
            --output "$RUNNER_TEMP/candidate-handoff.tar"
          cat "$RUNNER_TEMP/candidate-handoff.sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Save compiler outputs after successful core and race checks
        if: success() && needs.resolve.outputs.runtime_reused != 'true' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: |
            ${{ steps.compiler-paths.outputs.build }}
            ${{ steps.compiler-paths.outputs.modules }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-candidate-${{ matrix.platform }}-${{ needs.resolve.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/candidate-handoff.tar
            ${{ runner.temp }}/candidate-handoff.sha256
          if-no-files-found: error
          retention-days: 14
  verification:
    needs: [resolve, candidate]
    if: always() && !cancelled() && needs.resolve.result == 'success' && (needs.resolve.outputs.mode != 'full' || needs.candidate.result == 'success')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: ubuntu24.04-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          path: candidate-source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: needs.resolve.outputs.mode == 'full'
        with:
          name: release-candidate-${{ matrix.platform }}-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/candidate-input
      - id: restore
        name: Restore hash-bound immutable inputs (no rebuild fallback)
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.candidate_run }}
          EVIDENCE_RUN: ${{ needs.resolve.outputs.evidence_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(restore-platform --root candidate-source --candidate-sha "$SOURCE_SHA" --platform '${{ matrix.platform }}' --mode "$MODE")
          if [ "$MODE" = full ]; then
            args+=(--handoff "$RUNNER_TEMP/candidate-input/candidate-handoff.tar" --handoff-sha256 "$(cat "$RUNNER_TEMP/candidate-input/candidate-handoff.sha256")")
          else
            args+=(--candidate-run "$CANDIDATE_RUN")
            if [ -n "$EVIDENCE_RUN" ]; then args+=(--evidence-run "$EVIDENCE_RUN"); fi
          fi
          script=candidate-source/scripts/release_generated_ci.py
          # Older candidate helpers retain their checked restore + guard path.
          help_text="$(python "$script" --help)"
          if [ "$MODE" = guard-only ] && [[ "$help_text" == *restore-guard* ]]; then
            mkdir -p candidate-source/build/release
            set -o pipefail
            python "$script" restore-guard --root candidate-source --candidate-sha "$SOURCE_SHA" \
              --platform '${{ matrix.platform }}' --candidate-run "$CANDIDATE_RUN" --evidence-run "$EVIDENCE_RUN" \
              2>&1 | tee candidate-source/build/release/ci-guard.log
            cat candidate-source/build/release/ci-guard.log >> "$GITHUB_STEP_SUMMARY"
            echo "guarded=true" >> "$GITHUB_OUTPUT"
          else
            python "$script" "${args[@]}"
            echo "guarded=false" >> "$GITHUB_OUTPUT"
          fi
      - id: consumers
        name: Clean Go default + failure/Snapshot + GORM32; installed wheel + SQLAlchemy44
        if: needs.resolve.outputs.mode != 'guard-only'
        env:
          GOTOOLCHAIN: go1.26.10
        run: |
          python candidate-source/scripts/generated_release_acceptance.py --root candidate-source \
            --candidate-sha '${{ needs.resolve.outputs.source_sha }}' --platform '${{ matrix.platform }}' \
            --output candidate-source/build/release/generated-acceptance.json --go-build-jobs 1
      - id: guard
        name: Exact platform guard — READY / NOT READY
        if: always() && steps.restore.outcome == 'success' && steps.restore.outputs.guarded != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate-source/build/release
          set -o pipefail
          python candidate-source/scripts/release_generated_ci.py guard --root candidate-source \
            --candidate-sha '${{ needs.resolve.outputs.source_sha }}' --platform '${{ matrix.platform }}' \
            2>&1 | tee candidate-source/build/release/ci-guard.log
          cat candidate-source/build/release/ci-guard.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: release-evidence-${{ matrix.platform }}-${{ needs.resolve.outputs.source_sha }}
          path: |
            candidate-source/build/release/generated-acceptance.json
            candidate-source/build/release/generated-acceptance.log
            candidate-source/build/release/ci-ready.json
            candidate-source/build/release/ci-guard.log
            candidate-source/tests/evidence/alpha.json
          if-no-files-found: warn
          retention-days: 14
  feature-live:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: [resolve, runtime, units]
    uses: ./.github/workflows/live-host.yml
    with:
      source_commit: ${{ needs.resolve.outputs.source_sha }}
  feature-dump:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: [resolve, runtime, units]
    uses: ./.github/workflows/dump-import-productization.yml
    with:
      source_commit: ${{ needs.resolve.outputs.source_sha }}
  feature-django:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: [resolve, runtime, units]
    uses: ./.github/workflows/django-lifecycle.yml
    with:
      source_commit: ${{ needs.resolve.outputs.source_sha }}
  feature-routing:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: [resolve, runtime, units]
    uses: ./.github/workflows/connection-routing.yml
    with:
      source_commit: ${{ needs.resolve.outputs.source_sha }}
  feature-preparation:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: [resolve, runtime, units]
    uses: ./.github/workflows/preparation-migration.yml
    with:
      source_commit: ${{ needs.resolve.outputs.source_sha }}
  feature-sql:
    if: needs.resolve.outputs.features_reused != 'true'
    needs: [resolve, runtime, units]
    uses: ./.github/workflows/worker-failure.yml
    with:
      source_commit: ${{ needs.resolve.outputs.source_sha }}
  aggregate:
    needs: [resolve, runtime, units, verification, feature-live, feature-dump, feature-django, feature-routing, feature-preparation, feature-sql]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          path: candidate-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - id: features
        name: Require complete release feature acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python candidate-source/scripts/release_features.py gate
      - name: Restore and guard both platforms once — READY / NOT READY
        if: always() && steps.features.outcome == 'success'
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.mode == 'full' && github.run_id || needs.resolve.outputs.candidate_run }}
          EVIDENCE_RUN: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          script=candidate-source/scripts/release_generated_ci.py
          help_text="$(python "$script" --help)"
          if [[ "$help_text" == *restore-guard* ]]; then
            python "$script" restore-guard --root candidate-source \
              --candidate-sha "$SOURCE_SHA" --candidate-run "$CANDIDATE_RUN" --evidence-run "$EVIDENCE_RUN"
          else
            python "$script" restore --root candidate-source \
              --candidate-sha "$SOURCE_SHA" --candidate-run "$CANDIDATE_RUN" --evidence-run "$EVIDENCE_RUN"
            python "$script" guard --root candidate-source --candidate-sha "$SOURCE_SHA"
          fi
          cat candidate-source/build/release/ci-ready.json >> "$GITHUB_STEP_SUMMARY"
      - name: Record original feature success or revalidate its authenticated receipt
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.mode == 'full' && github.run_id || needs.resolve.outputs.candidate_run }}
          EVIDENCE_RUN: ${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python candidate-source/scripts/release_features.py record --root candidate-source
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: needs.resolve.outputs.features_reused != 'true'
        with:
          name: release-features-${{ needs.resolve.outputs.source_sha }}
          path: candidate-source/build/release/features.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: release-ready-${{ needs.resolve.outputs.source_sha }}
          path: |
            candidate-source/build/release/ci-ready.json
            candidate-source/build/release/SHA256SUMS
            candidate-source/build/release/qualification.json
          if-no-files-found: warn
          retention-days: 14
  publication:
    needs: [resolve, aggregate]
    if: always() && !cancelled() && inputs.operation == 'release' && needs.resolve.result == 'success' && needs.aggregate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: mariamem-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          path: candidate-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - id: publish
        name: Authenticate inputs and publish through one final aggregate guard
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_NOTES: ${{ inputs.notes }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.mode == 'full' && github.run_id || needs.resolve.outputs.candidate_run }}
          EVIDENCE_RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--root candidate-source --candidate-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" --candidate-run "$CANDIDATE_RUN" --evidence-run "$EVIDENCE_RUN")
          if [ -n "$RELEASE_NOTES" ]; then args+=(--notes "$RELEASE_NOTES"); fi
          git -C candidate-source config user.name 'github-actions[bot]'
          git -C candidate-source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python candidate-source/scripts/ci_release_publish.py "${args[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: release-publication-${{ needs.resolve.outputs.source_sha }}
          path: candidate-source/build/release/ci-publication.json
          if-no-files-found: warn
          retention-days: 14
  public_smoke_recovery:
    if: inputs.operation == 'public-smoke-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          path: published-source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Recover only public smoke against immutable published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.candidate_ref }}
          PUBLICATION_RUN: ${{ inputs.candidate_run }}
          SMOKE_REF: ${{ inputs.smoke_ref }}
        run: |
          python scripts/release_generated_ci.py recover-public-smoke --root published-source \
            --candidate-sha "$SOURCE_SHA" --platform ubuntu24.04-x86_64 \
            --repository "$GITHUB_REPOSITORY" --candidate-run "$PUBLICATION_RUN" --smoke-ref "$SMOKE_REF"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-smoke-recovery-${{ inputs.candidate_ref }}-${{ github.sha }}
          path: |
            published-source/build/release/ci-public-smoke-recovery.json
            published-source/build/release/ci-public-smoke-recovery.log
          if-no-files-found: warn
          retention-days: 14
  public_smoke:
    needs: [resolve, publication]
    if: always() && !cancelled() && inputs.operation == 'release' && needs.resolve.result == 'success' && needs.publication.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: ubuntu24.04-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          path: candidate-source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-publication-${{ needs.resolve.outputs.source_sha }}
          path: publication-input
      - name: Public module tag and downloaded accepted wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python candidate-source/scripts/release_generated_ci.py public-smoke --root candidate-source \
            --candidate-sha '${{ needs.resolve.outputs.source_sha }}' --platform '${{ matrix.platform }}' \
            --repository "$GITHUB_REPOSITORY" --publication publication-input/ci-publication.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: release-public-smoke-${{ matrix.platform }}-${{ needs.resolve.outputs.source_sha }}
          path: |
            candidate-source/build/release/ci-public-smoke.json
            candidate-source/build/release/ci-public-smoke.log
          if-no-files-found: warn
          retention-days: 14

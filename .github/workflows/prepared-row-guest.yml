name: Prepared raw-row real guest
on:
  push:
    branches: [experiment/prepared-row-guest]
permissions:
  contents: read
  actions: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: row-guest-c7b60a1d51512af44718025b10800e0b3c9130f2
          run-id: 42792328050
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/row-guest
      - name: Verify immutable successful guest and unchanged engine inputs
        run: |
          python3 scripts/git_identity.py inspect HEAD
          python3 -c 'import sys;from pathlib import Path;sys.path.insert(0,"scripts");from dev_guest import verify_guest;r=verify_guest(Path.cwd(),Path(sys.argv[1]));assert r["guest_sha256"]=="0c169331c230469f0d6e04af7cf5129710404913faeb8bce041b00c0e3b8a020"' "$RUNNER_TEMP/row-guest"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: row-guest-${{ github.sha }}
          path: ${{ runner.temp }}/row-guest
          if-no-files-found: error
          retention-days: 7
  metadata-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: test
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Observe pinned native C-extension and raw-wire metadata change
        run: |
          python -m pip install PyMySQL==1.2.3 mysql-connector-python==26.7.0
          mkdir -p build/metadata-reference
          python scripts/git_identity.py inspect HEAD > build/metadata-reference/source.json
          docker image inspect mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1 > build/metadata-reference/image.json
          python tests/raw_metadata_control.py --port 3307 --output build/metadata-reference/native.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: row-metadata-reference-${{ github.sha }}
          path: build/metadata-reference
          if-no-files-found: error
          retention-days: 7
  actual-guest:
    needs: [guest, metadata-reference]
    runs-on: macos-15
    timeout-minutes: 70
    env:
      PYTHONPATH: python
      GOTOOLCHAIN: go1.26.10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: row-guest-${{ github.sha }}
          path: ${{ runner.temp }}/row-guest
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: row-metadata-reference-${{ github.sha }}
          path: ${{ runner.temp }}/row-metadata-reference
      - name: Fixed test dependencies and required compiler
        run: |
          python -m pip install pytest PyMySQL==1.2.3 mysql-connector-python==26.7.0
          command -v clang
      - name: Translate, bind, build and exercise actual guest
        env:
          MARIAMEM_METADATA_REFERENCE: ${{ runner.temp }}/row-metadata-reference/native.json
        run: |
          mkdir -p build/row-evidence
          python scripts/git_identity.py inspect HEAD > build/row-evidence/source.json
          python scripts/experiment_disk.py --work-dir "$RUNNER_TEMP/row-host" --budget-gib 16 --min-free-gib 8 --timeout 3600 -- python scripts/regenerate_release_guest.py --development --guest-dir "$RUNNER_TEMP/row-guest" --output "$RUNNER_TEMP/row-host" > build/row-evidence/host.log 2>&1
          cp "$RUNNER_TEMP/row-host/development.json" build/row-evidence/
          MARIAMEM_TEST_HOST="$RUNNER_TEMP/row-host/mariamem-dev-host" python -m pytest -q tests/test_raw_row_guest.py > build/row-evidence/prepared.log 2>&1
          python tests/v06_prepared_call_probe.py --host "$RUNNER_TEMP/row-host/mariamem-dev-host" --output build/row-evidence/call.json > build/row-evidence/call.log 2>&1
      - name: Preserve failure details
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/row-host/failure.json" ]; then cp "$RUNNER_TEMP/row-host/failure.json" build/row-evidence/; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: row-actual-guest-${{ github.sha }}
          path: build/row-evidence
          retention-days: 7

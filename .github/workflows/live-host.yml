name: Live full acceptance
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit resolved by Release CI
        required: true
        type: string
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PLAYWRIGHT_BROWSERS_PATH: build/e2e-browsers
    services:
      mariadb:
        image: mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/live-host.yml
            tests/live_acceptance/native.py
      - name: Share Go compiler cache and discard restored test results
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Fixed browser and client inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          python -m pip install --no-cache-dir -r tests/e2e_native_control/requirements.lock.txt -r tests/preparation_migration_acceptance/requirements.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Native input guard and exact-source app
        env:
          NATIVE_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          python scripts/git_identity.py inspect HEAD
          python tests/dump_import_acceptance/linux_acquisition.py --container "$NATIVE_CONTAINER" --expected-source-commit "$SOURCE_COMMIT" --output build/live-native/acquisition
          go build -p 1 -trimpath -o build/go-live-orders ./tests/live_acceptance/goapp
      - name: Fresh native control for the reconnecting Go variant
        run: python scripts/experiment_disk.py --work-dir build --min-free-gib 4 --budget-gib 4 --timeout 600 -- python tests/live_acceptance/native.py --port 3307 --go-app build/go-live-orders --expected-source-commit "$SOURCE_COMMIT" --output build/live-native/reference
      - name: Fresh P1 authored command and callback native control
        run: PYTHONPATH="$PWD/python" python scripts/experiment_disk.py --work-dir build --min-free-gib 4 --budget-gib 4 --timeout 180 -- python tests/fixture_entry_acceptance/native.py --port 3307 --expected-source-commit "$SOURCE_COMMIT" --acquisition build/live-native/acquisition --output build/live-native/p1 --disposable-server
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: live-native-py${{ matrix.python }}-${{ inputs.source_commit }}
          path: build/live-native
          if-no-files-found: error
  live:
    needs: native-reference
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      PLAYWRIGHT_BROWSERS_PATH: build/e2e-browsers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
          filter: blob:none
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-runtime-${{ matrix.os }}-${{ inputs.source_commit }}
          path: .
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/live-host.yml
      - name: Share Go compiler cache and discard restored test results
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: py311
        with:
          python-version: '3.11'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: py314
        with:
          python-version: '3.14'
      - name: Verify shared release wheel and host
        run: python scripts/release_runtime.py --source-commit "$SOURCE_COMMIT"
      - name: Native client development library
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          else
            brew install pkgconf mariadb-connector-c
            echo "PKG_CONFIG_PATH=$(brew --prefix mariadb-connector-c)/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - name: Pinned SDK/browser and existing regression inputs
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          python scripts/git_identity.py inspect HEAD
          for py in "$PY311" "$PY314"; do
            "$py" -m pip install --no-cache-dir -r tests/e2e_native_control/requirements.lock.txt -r tests/routing_acceptance/unit-requirements.txt -r tests/preparation_migration_acceptance/requirements.txt mysql-connector-python==26.7.0 build==1.6.1 wheel==0.48.0 setuptools==84.0.0
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            python -m playwright install --with-deps chromium --only-shell
          else
            python -m playwright install chromium --only-shell
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: live-native-py3.11-${{ inputs.source_commit }}
          path: build/reference/py3.11
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: live-native-py3.14-${{ inputs.source_commit }}
          path: build/reference/py3.14
      - name: Evidence directory
        run: mkdir -p build/live-evidence
      - name: Bounded G1 fixture acceptance on both hosts
        run: python scripts/go_fixture_campaign.py --expected-source-commit "$SOURCE_COMMIT" --output build/live-evidence/g1
      - name: G1 physical fault controls and external Go fixture consumer
        run: python scripts/go_fixture_completion.py --expected-source-commit "$SOURCE_COMMIT" --output build/live-evidence/g1/completion
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: go-fixture-host-${{ matrix.os }}-${{ inputs.source_commit }}
          path: |
            build/live-evidence/g1/**/*.json
            build/live-evidence/g1/**/*.txt
          if-no-files-found: error
      - name: Exact-source acceptance executables
        run: |
          CGO_ENABLED=0 go build -p 1 -trimpath -o build/go-orders ./tests/e2e_native_control/goapp
          CGO_ENABLED=0 go build -p 1 -trimpath -o build/go-live-orders ./tests/live_acceptance/goapp
          CGO_ENABLED=0 go build -p 1 -trimpath -o build/go-owner ./tests/live_acceptance/go_owner
      - name: P1 real prepared command and callback on both Python minors
        shell: bash
        env:
          P1_RESOURCE_EXPERIMENT: '0'
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          cp tests/evidence/alpha-wheel.json build/live-evidence/p1-wheel.json
          for py in "$PY311" "$PY314"; do
            version=$("$py" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            "$py" -m venv "build/p1-py$version"
            py="$PWD/build/p1-py$version/bin/python"
            if [[ "$version" == 3.11 ]]; then pytest_version=7.0.0; else pytest_version=9.0.2; fi
            "$py" -m pip install --no-cache-dir -r tests/preparation_migration_acceptance/requirements.txt "pytest==$pytest_version"
            "$py" -m pip install --no-deps build/dist/*.whl
            # Keep real process/pipe/cleanup controls on both OS and Python boundaries.
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH="$PWD/python" "$py" -m pytest tests/test_prepare_command.py tests/test_p1_pytest_entry.py tests/test_owned_snapshot_unit.py -q > "build/live-evidence/py$version-p1-unit.txt" 2>&1
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 P1_INSTALLED_CONSUMER=1 P1_NATIVE_REFERENCE="$PWD/build/reference/py$version/p1" MARIAMEM_TEST_HOST="$PWD/build/mariamem-host" "$py" -m pytest tests/test_p1_runtime.py -q -s --basetemp "build/live-evidence/p1-py$version" > "build/live-evidence/py$version-p1-runtime.txt" 2>&1
          done
      - name: Public Go/Python browser Live, Fork control and actual defects
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          for py in "$PY311" "$PY314"; do
            version=$("$py" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            PYTHONPATH="$PWD/python" "$py" -m pytest tests/test_live_unit.py tests/test_e2e_numeric_bind.py tests/test_e2e_child_diagnostics.py -q > "build/live-evidence/py$version-unit.txt" 2>&1
            for scenario in positive skip-reset restart-app; do
              run_case() {
                "$py" scripts/experiment_disk.py --work-dir build --min-free-gib 4 --budget-gib 8 --timeout 900 -- "$py" tests/live_acceptance/run.py --host build/mariamem-host --go-app build/go-orders --go-live-app build/go-live-orders --go-owner build/go-owner --native-reference "build/reference/py$version/reference" --expected-source-commit "$SOURCE_COMMIT" --output "build/live-evidence/py$version/$scenario" "$@"
              }
              if [[ "$scenario" == positive ]]; then run_case; else run_case --mutation "$scenario"; fi
            done
          done
      - name: Runnable public documentation examples
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          for py in "$PY311" "$PY314"; do
            version=$("$py" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            "$py" scripts/experiment_disk.py --work-dir build --min-free-gib 4 --budget-gib 8 --timeout 900 -- "$py" docs/examples/live/verify.py --host build/mariamem-host --go-app build/go-live-orders --expected-source-commit "$SOURCE_COMMIT" --output "build/live-evidence/examples-py$version"
          done
      - name: Installed wheel and external Go module
        shell: bash
        run: python tests/live_acceptance/installed.py --expected-source-commit "$SOURCE_COMMIT" --output build/live-evidence/installed
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: live-host-${{ matrix.os }}-${{ inputs.source_commit }}
          path: build/live-evidence
          if-no-files-found: error

  required:
    name: Live full acceptance gate
    if: always()
    needs: [native-reference, live]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Require complete selected matrix
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/live_ci.py gate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: go-fixture-host-*-${{ inputs.source_commit }}
          path: build/g1-matrix
      - name: Validate both source-bound G1 host receipts
        run: |
          python scripts/go_fixture_campaign.py --expected-source-commit "$SOURCE_COMMIT" --validate-matrix build/g1-matrix
          python scripts/go_fixture_completion.py --expected-source-commit "$SOURCE_COMMIT" --validate-matrix build/g1-matrix

name: Issue 246 macOS Fork regression
run-name: Issue 246 macos-15 Fork and Close at 514706aa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-fork:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 514706aa3de90075ea504d2747b96c33168b1e7d
      GUEST_SHA: 67fbc6f0d16360383fbf5a033abd5ba0d3bd272c3384c4bbd077e61efd54ca5d
      MARIAMEM_TEST_DEFAULT: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.11
          cache: false
      - name: Record exact candidate, guest and ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/issue246-evidence
          {
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
            test "$(git cat-file -t "$CANDIDATE_SHA")" = commit
            test -z "$(git status --porcelain)"
            test "$(uname -m)" = arm64
            test "$(go env GOARCH)" = arm64
            git rev-parse HEAD
            uname -a
            sw_vers
            go version
            grep -F "$GUEST_SHA" release/generated-go-inputs.json internal/generatedgo/entry.go
            grep -Fq "$GUEST_SHA" release/generated-go-inputs.json
            grep -Fq "$GUEST_SHA" internal/generatedgo/entry.go
          } | tee build/issue246-evidence/identity.txt
          go clean -testcache
      - name: Repeat the original concurrent Fork and Close regression
        shell: bash
        run: |
          set -euo pipefail
          unset MARIAMEM_RUNTIME MARIAMEM_NATIVE_DIR
          for attempt in 1 2 3 4 5; do
            log="build/issue246-evidence/attempt-$attempt.txt"
            go test -v -count=1 -timeout=3m -tags=integration ./tests/gointegration \
              -run '^TestOwnedManyOrderParallelAndClose$' 2>&1 | tee "$log"
            grep -Fq -- '--- PASS: TestOwnedManyOrderParallelAndClose ' "$log"
            grep -Fq '35 mutating children + live-after-Close' "$log"
          done
          echo '5/5: concurrent Snapshot.Fork and Close completed on macOS ARM64.' \
            | tee -a "$GITHUB_STEP_SUMMARY" build/issue246-evidence/result.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: issue246-macos-fork-514706aa
          path: build/issue246-evidence/
          if-no-files-found: error
          retention-days: 30

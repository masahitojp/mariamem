name: Prepared lexer canonical source inputs (not Qualification)
on:
  push:
    branches: [experiment/lexer-canonical]
    paths:
      - guest/source.patch
      - scripts/lexer_prepared.py
      - scripts/prepare_guest.py
      - scripts/check_lexer_canonical_builds.py
      - benchmarks/lexerpreparedinput/**
      - tests/test_lexer_prepared_input.py
      - tests/lexer_prepared_acceptance.py
      - .github/workflows/lexer-canonical-input.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    timeout-minutes: 100
    steps:
      - name: Source builder dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Exact clean canonical source and independent bootstrap build
        env:
          HOME: /root
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p build/lexer-ci
          python3 scripts/git_identity.py inspect HEAD > build/lexer-ci/source.json
          python3 -c 'import json,os;assert json.load(open("build/lexer-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          test ! -e guest/experimental.patch
          python3 -m unittest discover -s tests -p test_lexer_prepared_input.py -v
          python3 scripts/build_generated_guest.py --development-output /tmp/lexer-canonical-guest > build/lexer-ci/build.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lexer-canonical-guest-${{ matrix.trial }}-${{ github.sha }}
          path: /tmp/lexer-canonical-guest
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: lexer-canonical-build-${{ matrix.trial }}-${{ github.sha }}
          path: build/lexer-ci
          if-no-files-found: error
          retention-days: 7
  compare:
    needs: guest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lexer-canonical-guest-1-${{ github.sha }}
          path: ${{ runner.temp }}/lexer-first
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lexer-canonical-guest-2-${{ github.sha }}
          path: ${{ runner.temp }}/lexer-second
      - name: Bind both independent builds to exact accepted guest bytes
        run: python3 scripts/check_lexer_canonical_builds.py --first "$RUNNER_TEMP/lexer-first" --second "$RUNNER_TEMP/lexer-second" --output build/lexer-comparison.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lexer-canonical-comparison-${{ github.sha }}
          path: build/lexer-comparison.json
          if-no-files-found: error
          retention-days: 7
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: test
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Native normal and binary prepared SQL reference
        run: |
          python -m pip install PyMySQL==1.2.3 mysql-connector-python==26.7.0
          mkdir -p build/lexer-reference
          python scripts/git_identity.py inspect HEAD > build/lexer-reference/source.json
          python -c 'import json,os;assert json.load(open("build/lexer-reference/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          docker image inspect mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1 --format '{{json .}}' > build/lexer-reference/image.json
          python tests/lexer_prepared_acceptance.py --native-port 3307 --output build/lexer-reference/native.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lexer-canonical-reference-${{ github.sha }}
          path: build/lexer-reference
          if-no-files-found: error
          retention-days: 7

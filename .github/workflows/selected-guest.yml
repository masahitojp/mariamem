name: Selected guest generation
on:
  push:
    branches: [experiment/issue134-formal-generation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selected-guest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install pytest
      - name: Selection, receipt and legacy boundary regressions
        run: >-
          python -m pytest -q tests/test_selected_guest.py tests/test_dev_guest_tools.py
          tests/test_guest_input_resolver.py tests/test_guest_preparation_context.py
          tests/test_preview_guest_inputs.py tests/test_guest_repro_tools.py
          tests/test_development_scope.py
  producer:
    needs: boundaries
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install canonical native build tools
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build bison pkg-config curl ca-certificates git \
            libssl-dev zlib1g-dev libpcre2-dev libncurses-dev xz-utils
      - name: Two independent selected builds and bound raw translation
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          sudo -H -E env PATH="$PATH" "$(command -v python)" scripts/selected_guest_ci.py \
            --source-commit "$CANDIDATE" --engine 13.2.0 --profile native-text \
            --output /opt/mariamem-selected --budget-gib 24 --min-free-gib 8 \
            --build-timeout 7200 --translation-timeout 1800
      - name: Preserve handoff and failure evidence
        if: always()
        run: |
          sudo mkdir -p /opt/mariamem-selected
          sudo chown -R "$(id -u):$(id -g)" /opt/mariamem-selected
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, tarfile
          root = Path('/opt/mariamem-selected')
          target = root/'handoff.tar.gz'
          members = ['guest', 'review/binding-inputs.json', 'review/failure.json',
                     'review/translation/input-manifest.json', 'review/translation/guest.wasm',
                     'review/translation/wasm2go', 'review/translation/module']
          with tarfile.open(target, 'w:gz') as archive:
              for name in members:
                  if (root/name).exists():
                      archive.add(root/name, arcname=name)
          (root/'handoff-sha256.json').write_text(json.dumps({
              'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
              'binding': 'NOT_REVIEWED', 'public_acceptance': 'NOT_RUN'}, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: selected-guest-${{ github.sha }}
          path: |
            /opt/mariamem-selected/producer.json
            /opt/mariamem-selected/phases.jsonl
            /opt/mariamem-selected/*.txt
            /opt/mariamem-selected/handoff.tar.gz
            /opt/mariamem-selected/handoff-sha256.json
          if-no-files-found: error
          retention-days: 14

name: Release native SQL regressions
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit resolved by Release CI
        required: true
        type: string
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
jobs:
  worker-failure-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['33315:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install PyMySQL==1.2.3
      - name: Fresh native duplicate-removal reference
        run: python tests/text_dedup_acceptance.py native --source-commit "$SOURCE_COMMIT" --native-image mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e --output build/worker-failure/native.json
      - name: Fresh native ordinary SQL reference (one-minute budget)
        timeout-minutes: 1
        run: python tests/text_dedup_acceptance.py native --suite ordinary --source-commit "$SOURCE_COMMIT" --native-image mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e --output build/worker-failure/ordinary-native.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: worker-failure-native-${{ inputs.source_commit }}
          path: build/worker-failure
          if-no-files-found: error

  worker-failure:
    needs: worker-failure-native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # Cold macOS guest compilation can consume the original 30-minute job budget.
    # The ordinary SQL steps and combined reference/guest budget remain one minute.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-runtime-${{ matrix.os }}-${{ inputs.source_commit }}
          path: .
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false # Only Go build-info inspection; consume the shared host.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Verify shared release wheel and host
        run: python scripts/release_runtime.py --source-commit "$SOURCE_COMMIT"
      - run: python -m pip install pytest PyMySQL==1.2.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: worker-failure-native-${{ inputs.source_commit }}
          path: build/worker-failure/reference
      - name: Source identity
        run: python scripts/git_identity.py inspect HEAD
      - name: Exact-source host and native equality
        run: |
          python tests/text_dedup_acceptance.py guest --source-commit "$SOURCE_COMMIT" --host build/mariamem-host --reference build/worker-failure/reference/native.json --output build/worker-failure/guest.json
      - name: Ordinary SQL native/guest comparison (one-minute budget)
        timeout-minutes: 1
        run: python tests/text_dedup_acceptance.py guest --suite ordinary --source-commit "$SOURCE_COMMIT" --host build/mariamem-host --reference build/worker-failure/reference/ordinary-native.json --output build/worker-failure/ordinary-guest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: worker-failure-${{ matrix.os }}-${{ inputs.source_commit }}
          path: |
            build/worker-failure/guest.json
            build/worker-failure/ordinary-guest.json
            build/worker-failure/reference/ordinary-native.json
            build/worker-failure/reference/native.json
          if-no-files-found: warn

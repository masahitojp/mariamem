name: Connection routing acceptance
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit resolved by Release CI
        required: true
        type: string
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-runtime-${{ matrix.os }}-${{ inputs.source_commit }}
          path: .
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Verify shared release wheel and host
        run: python scripts/release_runtime.py --source-commit "$SOURCE_COMMIT"
      - name: Install pinned consumers
        run: |
          mkdir -p "$RUNNER_TEMP/routing/evidence"
          python -m pip install --no-cache-dir --report "$RUNNER_TEMP/routing/evidence/dependencies.json" -r tests/routing_acceptance/requirements.txt -r tests/routing_acceptance/unit-requirements.txt
          python tests/v06_prepared_connector_environment.py --output "$RUNNER_TEMP/routing/evidence/connector-environment.json"
      - name: Exact-source real guest, R1-R8 and strict defect oracles
        run: |
          python scripts/experiment_disk.py --work-dir "$RUNNER_TEMP/routing" --min-free-gib 4 --budget-gib 8 --timeout 2400 -- python tests/routing_acceptance/run.py --runtime-root "$GITHUB_WORKSPACE" --source-commit "$SOURCE_COMMIT" --host "$GITHUB_WORKSPACE/build/mariamem-host" --output "$RUNNER_TEMP/routing"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: routing-${{ matrix.os }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/routing/evidence
          if-no-files-found: error

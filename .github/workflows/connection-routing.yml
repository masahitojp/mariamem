name: Connection routing acceptance
on:
  push:
    branches: [feat/connection-routing, main]
    paths:
      - 'python/mariamem/*routing*.py'
      - 'python/mariamem/pytest_plugin.py'
      - 'tests/*routing*.py'
      - 'tests/routing_acceptance/**'
      - '.github/workflows/connection-routing.yml'
      - 'scripts/development_scope.py'
      - 'scripts/git_identity.py'
      - 'tests/test_ci_efficiency.py'
      - 'tests/test_routing_ci_workflow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      ubuntu_check: ${{ steps.diff.outputs.ubuntu_check }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - id: diff
        run: python scripts/development_scope.py --candidate-sha '${{ github.sha }}' --github-output
  source:
    needs: scope
    if: needs.scope.outputs.ubuntu_check != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/routing_acceptance/unit-requirements.txt
      - run: python scripts/verify.py check
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            pytest: '7.0.0'
          - python: '3.14'
            pytest: '9.0.2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'pytest==${{ matrix.pytest }}' -r tests/routing_acceptance/unit-requirements.txt
      - run: python -m pytest tests/test_routing.py tests/test_routing_pytest.py tests/test_routing_receipts.py -q
        env:
          PYTHONPATH: python
  native:
    needs: [scope, compatibility, source]
    # A delegated source check must not skip the dedicated native matrix.
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' &&
      needs.compatibility.result == 'success' &&
      (needs.source.result == 'success' ||
       (needs.source.result == 'skipped' && needs.scope.outputs.ubuntu_check == 'false')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install pinned consumers
        run: |
          mkdir -p "$RUNNER_TEMP/routing/evidence"
          python -m pip install --no-cache-dir --report "$RUNNER_TEMP/routing/evidence/dependencies.json" -r tests/routing_acceptance/requirements.txt -r tests/routing_acceptance/unit-requirements.txt
          python tests/v06_prepared_connector_environment.py --output "$RUNNER_TEMP/routing/evidence/connector-environment.json"
      - name: Unit and early-plugin boundaries
        run: python -m pytest tests/test_routing.py tests/test_routing_pytest.py tests/test_routing_receipts.py -q
        env:
          PYTHONPATH: python
      - name: Exact-source real guest, R1-R8 and strict defect oracles
        run: |
          python scripts/experiment_disk.py --work-dir "$RUNNER_TEMP/routing" --min-free-gib 4 --budget-gib 8 --timeout 2400 -- python tests/routing_acceptance/run.py --runtime-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/routing"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: routing-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/routing/evidence
          if-no-files-found: error

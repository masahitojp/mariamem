name: Canonical prepared candidate (not Qualification)
on:
  push:
    branches: [experiment/prepared-canonical]
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    timeout-minutes: 100
    steps:
      - name: Source builder dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Trust this checkout
        env:
          HOME: /root
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Two independent canonical source builds
        env:
          HOME: /root
        run: |
          test "$HOME" = /root
          test "$(id -u)" = 0
          mkdir -p build/prepared-ci
          python3 scripts/git_identity.py inspect HEAD > build/prepared-ci/source.json
          python3 -c 'import json,os;assert json.load(open("build/prepared-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          test ! -e guest/experimental.patch
          python3 scripts/build_generated_guest.py > build/prepared-ci/guest-build.txt 2>&1
          /root/.wasixcc/binaryen/bin/wasm-opt -O2 --enable-threads --enable-mutable-globals --enable-bulk-memory --enable-bulk-memory-opt --enable-exception-handling --enable-simd --enable-relaxed-simd --enable-extended-const --symbolmap=build/generated-release/function.map /work/artifact/mariamem-legacy-eh.wasm -o build/generated-release/mapped.wasm
          cp /work/artifact/mariamem-legacy-eh.wasm build/generated-release/linked.wasm
          python3 -c 'import hashlib,json;h=lambda p:hashlib.sha256(open(p,"rb").read()).hexdigest();assert h("build/generated-release/mapped.wasm")==json.load(open("release/generated-go-inputs.json"))["guest_sha256"]'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: canonical-prepared-guest-${{ github.sha }}
          path: build/generated-release
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: canonical-prepared-source-${{ github.sha }}
          path: build/prepared-ci
          retention-days: 7
  p5-native-control:
    # Fixed native reference under canonical Python3.14; both supported hosts
    # compare to this explicitly Linux x86_64 control, never a macOS server.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: test
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      GOTOOLCHAIN: go1.26.10
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Exact native-control inputs
        run: |
          python -m pip install PyMySQL==1.2.3 mysql-connector-python==26.7.0
          mkdir -p build/prepared-p5-native
          python scripts/git_identity.py inspect HEAD > build/prepared-p5-native/source.json
          python -c 'import json,os;assert json.load(open("build/prepared-p5-native/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          docker image inspect mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1 --format '{{json .}}' > build/prepared-p5-native/image.json
      - name: Native connector availability, without import workarounds
        run: python tests/v06_prepared_connector_environment.py --output build/prepared-p5-native/environment.json
      - name: Native real consumer observation with functional failures retained
        run: |
          go build -race -trimpath -buildvcs=false -o "$RUNNER_TEMP/prepared-p5-native-consumer" ./tests/prepared_consumer
          set +e
          python tests/v06_prepared_consumers.py --native-port 3307 --consumer "$RUNNER_TEMP/prepared-p5-native-consumer" --output build/prepared-p5-native/consumers.json > build/prepared-p5-native/consumers.txt 2>&1
          consumer_exit=$?
          set -e
          python tests/v06_prepared_consumer_edges.py --native-port 3307 --output build/prepared-p5-native/edges.json > build/prepared-p5-native/edges.txt 2>&1
          python tests/v06_prepared_p5_compare.py --actual build/prepared-p5-native/consumers.json --native tests/fixtures/prepared-p5-native-macos314.json --actual-environment build/prepared-p5-native/environment.json --native-cext-environment tests/fixtures/prepared-p5-native-macos314-environment.json --actual-edges build/prepared-p5-native/edges.json --native-edges tests/fixtures/prepared-p5-native-macos314-edges.json --accepted-disposition docs/decisions/prepared-consumer-exceptions.md --consumer-exit "$consumer_exit" --output build/prepared-p5-native/matching.json
      - name: Additional MariaDB official stable driver, native two-case replay
        run: |
          python tests/v06_install_mariadb_driver.py --output build/prepared-p5-native/mariadb-install.json > build/prepared-p5-native/mariadb-install.txt 2>&1
          python tests/v06_prepared_mariadb_probe.py --native-port 3307 --output build/prepared-p5-native/mariadb-driver.json > build/prepared-p5-native/mariadb-driver.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: prepared-p5-native-${{ github.sha }}
          path: build/prepared-p5-native
          if-no-files-found: error
          retention-days: 7
  native:
    needs: [guest, p5-native-control]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: go1.26.10
      PYTHONDONTWRITEBYTECODE: '1'
      MARIAMEM_ROUTINE_REQUIRE_CONNECTOR: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: canonical-prepared-guest-${{ github.sha }}
          path: build/generated-release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: prepared-p5-native-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-native-control
      - name: Fixed consumers and source checks
        run: |
          python -m pip install -r tests/consumer/sqlalchemy-requirements.txt mysql-connector-python==26.7.0 setuptools wheel
          mkdir -p build/prepared-ci
          python scripts/git_identity.py inspect HEAD > build/prepared-ci/source.json
          python -c 'import json,os;assert json.load(open("build/prepared-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          python scripts/verify.py check > build/prepared-ci/check.txt 2>&1
      - name: Independent canonical Go regeneration and build guard
        run: |
          python scripts/regenerate_release_guest.py --output "$RUNNER_TEMP/canonical-prepared-regeneration" > build/prepared-ci/regeneration.txt 2>&1
          cp build/generated-release/guest.json build/prepared-ci/guest.json
          cp build/generated-release/regeneration.json build/prepared-ci/regeneration.json
          python -c 'import sys,os;sys.path.insert(0,"scripts");from common import ROOT;from generated_release import verify_build;verify_build(ROOT,os.environ["GITHUB_SHA"])' > build/prepared-ci/build-guard.txt 2>&1
      - name: Standard runtime integration including routine and text consumer gates
        run: python scripts/verify.py integration > build/prepared-ci/integration.txt 2>&1
      - name: J1 failure oracle and protected controls
        run: |
          python tests/routine_thread_fixture.py --output "$RUNNER_TEMP/canonical-prepared-j1" --run > build/prepared-ci/j1.txt 2>&1
          cp "$RUNNER_TEMP/canonical-prepared-j1/identities.json" build/prepared-ci/j1-identities.json
          cp "$RUNNER_TEMP/canonical-prepared-j1/results.json" build/prepared-ci/j1-results.json
          cp "$RUNNER_TEMP/canonical-prepared-j1/"*.txt build/prepared-ci/
      - name: Go routine lifecycle and bounded DEFINER
        run: |
          go build -p 1 -trimpath -o build/prepared-ci/mariamem-host ./cmd/mariamem-host
          PYTHONPATH=python python tests/v06_routine_definer_probe.py --host build/prepared-ci/mariamem-host --output build/prepared-ci/definer.json > build/prepared-ci/definer.txt 2>&1
          go run -p 1 -trimpath ./tests/routine_probe -output build/prepared-ci/go-routines.json > build/prepared-ci/go-routines.txt 2>&1
          go run -p 1 -trimpath ./cmd/mariamem-guest auth-check > build/prepared-ci/auth.txt 2>&1
      - name: Local-only wheel and existing ORM consumers
        run: |
          python scripts/build_alpha.py --ci-candidate > build/prepared-ci/wheel.txt 2>&1
          python -m pip install --force-reinstall --no-deps build/dist/*.whl
          python tests/consumer/run_sqlalchemy.py --output build/prepared-ci/sqlalchemy > build/prepared-ci/sqlalchemy.txt 2>&1
          python tests/consumer/run_gorm.py --source-dir "$GITHUB_WORKSPACE" --zero-options --output build/prepared-ci/gorm > build/prepared-ci/gorm.txt 2>&1
      - name: Canonical installed binding for complete P1-P4 replay
        run: |
          python tests/check_prepared_p1_binding.py --runtime internal/generatedgo > build/prepared-ci/prepared-binding.txt 2>&1
          go build -p 1 -trimpath -o build/prepared-ci/mariamem-host ./cmd/mariamem-host
      - name: Real P1 wire lifecycle and native metadata differential
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_p1_probe.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-p1-native.json --output build/prepared-ci/runtime.json > build/prepared-ci/runtime.txt 2>&1
      - name: Real P2 typed EXECUTE vectors and native binary result differential
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_p2_probe.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-p2-native.json --output build/prepared-ci/execute.json > build/prepared-ci/execute.txt 2>&1
      - name: Bounded TIME metadata repair compared with native
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_time_probe.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-time-native.json --output build/prepared-ci/time.json > build/prepared-ci/time.txt 2>&1
      - name: Additional P2 DML, schema, wire types and SQL modes compared with native
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_p2_matrix.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-p2-matrix-native.json --output build/prepared-ci/matrix.json > build/prepared-ci/matrix.txt 2>&1
      - name: P2 repair NULL, type transitions and single-execution metadata controls
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_p2_repair_probe.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-p2-repair-native.json --output build/prepared-ci/repair.json > build/prepared-ci/repair.txt 2>&1
      - name: Common numeric and text unsigned NULL transitions compared with native
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_unsigned_probe.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-unsigned-native.json --output build/prepared-ci/unsigned.json > build/prepared-ci/unsigned.txt 2>&1
      - name: P3 minimal CALL two ordinary results plus OUT compared with native
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_call_probe.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-call-native.json --output build/prepared-ci/call.json > build/prepared-ci/call.txt 2>&1
      - name: Full P3 result counts, IN OUT INOUT, errors, metadata and capability negotiation
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_p3_matrix.py --host build/prepared-ci/mariamem-host --require-advertisement --reference tests/fixtures/prepared-p3-native.json --output build/prepared-ci/p3-matrix.json > build/prepared-ci/p3-matrix.txt 2>&1
      - name: P4 first slice physical sessions, RESET, quota and disconnect cleanup
        env:
          PYTHONPATH: python
        run: |
          go build -o "$RUNNER_TEMP/prepared-p4-consumer" ./tests/prepared_lifetime
          python tests/v06_prepared_p4_lifetime.py --host build/prepared-ci/mariamem-host --consumer "$RUNNER_TEMP/prepared-p4-consumer" --reference tests/fixtures/prepared-p4-lifetime-native.json --output build/prepared-ci/p4-lifetime.json > build/prepared-ci/p4-lifetime.txt 2>&1
      - name: P4 engine-owned LONG_DATA, type reuse, deferred errors and native limits
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_prepared_long_data_probe.py --host build/prepared-ci/mariamem-host --reference tests/fixtures/prepared-long-data-native.json --output build/prepared-ci/long-data.json > build/prepared-ci/long-data.txt 2>&1
      - name: P4 witnessed active EXECUTE cancellation, TCP exits and isolated cleanup
        env:
          PYTHONPATH: python
        run: |
          go build -race -trimpath -buildvcs=false -o "$RUNNER_TEMP/prepared-active-consumer" ./tests/prepared_active
          python tests/v06_prepared_active_probe.py --host build/prepared-ci/mariamem-host --consumer "$RUNNER_TEMP/prepared-active-consumer" --reference tests/fixtures/prepared-active-native.json --output build/prepared-ci/active.json > build/prepared-ci/active.txt 2>&1
      - name: Exact P5 accepted-exception edges and fresh native reference
        env:
          PYTHONPATH: python
        run: |
          python scripts/check_prepared_consumers.py --host build/prepared-ci/mariamem-host --output build/prepared-ci/selected-consumers > build/prepared-ci/selected-consumers.txt 2>&1
          python tests/v06_prepared_p5_compare.py --actual build/prepared-ci/selected-consumers/consumers.json --native "$RUNNER_TEMP/prepared-native-control/consumers.json" --native-cext tests/fixtures/prepared-p5-native-macos314.json --actual-environment build/prepared-ci/selected-consumers/environment.json --native-cext-environment tests/fixtures/prepared-p5-native-macos314-environment.json --actual-edges build/prepared-ci/selected-consumers/edges.json --native-edges "$RUNNER_TEMP/prepared-native-control/edges.json" --native-cext-edges tests/fixtures/prepared-p5-native-macos314-edges.json --accepted-disposition docs/decisions/prepared-consumer-exceptions.md --consumer-exit 1 --output build/prepared-ci/fresh-native-matching.json
      - name: MariaDB official driver two-case regression
        env:
          PYTHONPATH: python
        run: |
          python tests/v06_install_mariadb_driver.py --output build/prepared-ci/mariadb-install.json > build/prepared-ci/mariadb-install.txt 2>&1
          python tests/v06_prepared_mariadb_probe.py --host build/prepared-ci/mariamem-host --reference "$RUNNER_TEMP/prepared-native-control/mariadb-driver.json" --output build/prepared-ci/mariadb-driver.json > build/prepared-ci/mariadb-driver.txt 2>&1
      - name: Reproduce retained-library symbols and guard failures
        run: |
          python scripts/audit_generated_licenses.py --guest build/generated-release/mariamem.wasm --linked build/generated-release/linked.wasm --function-map build/generated-release/function.map --host build/prepared-ci/mariamem-host --output build/prepared-ci/license-audit.json > build/prepared-ci/license-audit.txt 2>&1
          python scripts/check_prepared_build_guards.py --output build/prepared-ci/build-guard-mutations.json > build/prepared-ci/build-guard-mutations.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: canonical-prepared-native-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/prepared-ci/*.txt
            build/prepared-ci/*.json
            build/prepared-ci/sqlalchemy
            build/prepared-ci/gorm
            build/prepared-ci/selected-consumers/*.json
          if-no-files-found: error
          retention-days: 7

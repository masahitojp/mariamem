name: Shutdown candidate validation
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit selected by the manual lifecycle dispatcher
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Match the recorded native C-extension profile's Python minor.
          python-version: '3.14.8'
      - name: Reuse compiler cache, not cached test results
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - name: Fixed consumer inputs
        run: python -m pip install --no-cache-dir PyMySQL==1.2.3 mysql-connector-python==26.7.0
      - name: Pin source and reject mismatched consumer profile before compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/shutdown-evidence
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          python scripts/git_identity.py inspect HEAD > build/shutdown-evidence/source.json
          go version > build/shutdown-evidence/go.txt
          sw_vers > build/shutdown-evidence/platform.txt
          python tests/v06_prepared_connector_environment.py --require-cext --output build/shutdown-evidence/environment.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from v06_prepared_p5_compare import verify_cext_profile
          verify_cext_profile(
              json.loads(Path('build/shutdown-evidence/environment.json').read_text()),
              json.loads(Path('tests/fixtures/prepared-p5-native-macos314-environment.json').read_text()))
          PY
      - name: Build the existing canonical guest host once
        shell: bash
        run: |
          set -euo pipefail
          go build -p 1 -o build/mariamem-host ./cmd/mariamem-host
          go version -m build/mariamem-host > build/shutdown-evidence/host-build-info.txt
          shasum -a 256 build/mariamem-host > build/shutdown-evidence/host-sha256.txt
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from git_identity import verify_go_binary
          verify_go_binary(Path.cwd(), Path('build/mariamem-host'), os.environ['SOURCE_COMMIT'])
          PY
      - name: Shutdown errors and clean snapshot export
        shell: bash
        run: |
          set -euo pipefail
          go test -v -p 1 -count=1 ./internal/host \
            -run 'TestShutdownPurposeAndSettingFailure|TestSnapshotDestination|TestConsumedFailureKeepsTransferUntilGuestAndWorkersJoin' \
            2>&1 | tee build/shutdown-evidence/host-tests.txt
      - name: ReSnapshot, live transactions and parallel child disposal
        env:
          MARIAMEM_TEST_DEFAULT: '1'
        shell: bash
        run: |
          set -euo pipefail
          go test -v -p 1 -count=1 -timeout=3m -tags=integration ./tests/gointegration \
            -run 'TestShutdownModeSnapshotAndResnapshot|TestMultipleClientSnapshotAndShutdown|TestOwnedManyOrderParallelAndClose' \
            2>&1 | tee build/shutdown-evidence/runtime-tests.txt
      - name: Fixed prepared consumers and accepted-exception oracle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_prepared_consumers.py --host "$PWD/build/mariamem-host" \
            --output build/shutdown-evidence/prepared-consumers \
            2>&1 | tee build/shutdown-evidence/consumers.txt
      - name: Keep consumer hashes instead of generated binaries
        if: always()
        shell: bash
        run: |
          if [ -f build/shutdown-evidence/prepared-consumers/consumer ]; then
            shasum -a 256 build/shutdown-evidence/prepared-consumers/consumer > build/shutdown-evidence/consumer-sha256.txt
            rm build/shutdown-evidence/prepared-consumers/consumer
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: shutdown-macos-${{ env.SOURCE_COMMIT }}
          path: build/shutdown-evidence
          if-no-files-found: error

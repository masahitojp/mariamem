name: Fixed-source macOS SQL CPU probe (experiment only)
# Branch-local replacement of an existing dispatch entry; never merge this workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: go1.27.4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: tooling
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e00b3ec41f9c5d4ca3f85db4ff73198dbf3613e9
          path: source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Pin source and record hosted hardware
        working-directory: source
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/git_identity.py inspect HEAD
          test "$(git rev-parse HEAD)" = e00b3ec41f9c5d4ca3f85db4ff73198dbf3613e9
          test -z "$(git status --porcelain)"
      - name: Six finite processes, including semantic check and CPU profile
        working-directory: source
        run: |
          python3 scripts/experiment_workspace.py prepare mac-probe \
            --branch experiment/mac-probe --min-free-gib 8 --budget-gib 8
          python3 scripts/experiment_workspace.py run --timeout 1800 mac-probe -- \
            python3 "$GITHUB_WORKSPACE/tooling/benchmarks/mac-probe-20261127/mac_probe.py" \
            --repo "$PWD" --workspace "$PWD/build/experiment-work/mac-probe/temp/probe"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-probe-e00b3ec4-${{ github.run_id }}
          path: |
            source/build/experiment-work/mac-probe/temp/probe/evidence/
            source/build/experiment-work/mac-probe/evidence/
            source/build/experiment-work/mac-probe/experiment.json
          if-no-files-found: warn
          retention-days: 14
      - name: Clean owned scratch after evidence upload
        if: always()
        working-directory: source
        run: |
          python3 scripts/experiment_workspace.py cleanup --name mac-probe --apply --json

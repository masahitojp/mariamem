name: Windows native acceptance
on:
  push:
    branches: [feat/issue242-windows-runtime-port]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit resolved by Release CI
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-native-${{ inputs.source_commit && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.source_commit }}
env:
  PYTHONUTF8: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
            python_arch: x64
            target: windows-x86_64
            wheel: win_amd64
          - runner: windows-11-arm
            arch: arm64
            python_arch: arm64
            target: windows-arm64
            wheel: win_arm64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ${{ inputs.source_commit && 'release-candidate-windows' || format('windows-boundary-{0}-{1}', github.run_id, matrix.arch) }}
      queue: max
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit || github.sha }}
        # Provenance hashes bind repository bytes, including LF line endings.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: true
      - name: Require the native Go architecture and record source
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PYTHON: ${{ matrix.wheel }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          if ((go env GOHOSTARCH) -ne $env:EXPECTED_ARCH) { throw 'Go toolchain architecture mismatch' }
          if ((go env GOARCH) -ne $env:EXPECTED_ARCH) { throw 'Go target architecture mismatch' }
          $expectedCPU = if ($env:EXPECTED_ARCH -eq 'arm64') { 'ARM64' } else { 'AMD64' }
          if ($env:PROCESSOR_ARCHITECTURE -ne $expectedCPU) { throw 'Runner architecture mismatch' }
          python -c "import os,sysconfig; assert sysconfig.get_platform().replace('-','_') == os.environ['EXPECTED_PYTHON']"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -cne $env:SOURCE_COMMIT) { throw 'Checkout differs from the candidate commit' }
          python scripts/git_identity.py inspect HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_generated_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GOCACHE=$(go env GOCACHE)" >> $env:GITHUB_ENV
          go clean -testcache
      - name: Snapshot ownership and memory, mappings and narrow atomics
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force build/windows-boundary | Out-Null
          go test -count=1 -timeout=8m -json ./internal/snapshot ./internal/generatedgo/code/base ./internal/artifacts ./internal/forklimit ./internal/entropyfs > build/windows-boundary/tests.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install packaging and focused Python test tools
        run: python -m pip install pytest==8.4.2 PyMySQL==1.2.3 setuptools==80.9.0 wheel==0.45.1
      - name: Check Python OS boundaries before building the host
        env:
          PYTHONPATH: python
        run: python -m pytest -q tests/test_windows_distribution.py tests/windows/test_prepare.py tests/windows/test_control_pipe.py
      - id: build
        name: Build one immutable host and wheel for this CPU
        shell: pwsh
        env:
          RELEASE_CANDIDATE: ${{ inputs.source_commit != '' }}
        run: |
          $wheelArgs = @('--ci-candidate')
          if ($env:RELEASE_CANDIDATE -eq 'true') { $wheelArgs += '--release-wheel' }
          python scripts/build_alpha.py @wheelArgs
      - name: Verify owned-log close before unlink
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./internal/control -run '^(TestOwnedLogCleanupClosesBeforeRemoval|TestDatabaseLogCleanupRetriesRemovalAfterClosingWriter)$'
      - name: Install the same wheel in a fresh environment and accept changed boundaries
        shell: pwsh
        run: |
          $wheel = (Get-Content -Raw tests/evidence/alpha-wheel.json | ConvertFrom-Json).wheel
          python scripts/native_candidate_acceptance.py --target '${{ matrix.target }}' --wheel $wheel --output 'build/windows-boundary/acceptance.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-boundary-${{ matrix.arch }}-${{ inputs.source_commit || github.sha }}
          overwrite: ${{ inputs.source_commit != '' && github.run_attempt > 1 }}
          path: |
            build/windows-boundary/tests.json
            build/windows-boundary/acceptance.json
            tests/evidence/alpha-wheel.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.build.outcome == 'success'
        with:
          name: windows-wheel-${{ matrix.arch }}-${{ inputs.source_commit || github.sha }}
          overwrite: ${{ inputs.source_commit != '' && github.run_attempt > 1 }}
          path: build/dist/*.whl
          if-no-files-found: error
          retention-days: 7

name: Memory Snapshot and shared host native verification
on:
  push:
    branches: [experiment/d-heap-shared-host]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install pytest PyMySQL setuptools wheel pytest-xdist
      - name: Source identity and canonical checks
        run: |
          mkdir -p build/sharedhost-evidence
          python scripts/git_identity.py inspect HEAD > build/sharedhost-evidence/source.json
          python scripts/verify.py check > build/sharedhost-evidence/check.txt 2>&1
      - name: Native storage, Go and Python lifecycle
        run: python scripts/verify.py integration > build/sharedhost-evidence/integration.txt 2>&1
      - name: Installed wheel and worker-local fixtures
        run: |
          python scripts/build_alpha.py --ci-candidate > build/sharedhost-evidence/wheel.txt 2>&1
          python -m venv build/consumer-venv
          build/consumer-venv/bin/python -m pip install build/dist/*.whl pytest PyMySQL pytest-xdist
          mkdir -p "$RUNNER_TEMP/sharedhost-consumer"
          cp tests/consumer/test_database.py tests/consumer/test_generated_platform.py "$RUNNER_TEMP/sharedhost-consumer/"
          "$GITHUB_WORKSPACE/build/consumer-venv/bin/python" -m pytest --confcutdir="$RUNNER_TEMP/sharedhost-consumer" -n 2 "$RUNNER_TEMP/sharedhost-consumer" -q > build/sharedhost-evidence/consumer.txt 2>&1
      - name: Executable guides and external Go module
        env:
          MARIAMEM_TEST_HOST: ${{ github.workspace }}/build/mariamem-host
          PYTHONPATH: python
        run: python -m pytest tests/test_usability_examples.py -q > build/sharedhost-evidence/guides.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: sharedhost-ubuntu-${{ github.sha }}
          path: build/sharedhost-evidence
          if-no-files-found: error

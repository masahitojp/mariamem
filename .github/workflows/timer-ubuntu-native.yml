name: Timer Ubuntu native confirmation (not Qualification)
on:
  push:
    branches: [experiment/timer-ubuntu-native]
    paths:
      - .github/workflows/timer-ubuntu-native.yml
      - tests/timer_runtime/ubuntu.py
      - tests/test_timer_ubuntu.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: timer-ubuntu-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Fixed SQL and test clients
        run: python -m pip install pytest==9.0.2 PyMySQL==1.1.2
      - name: Focused evidence guards
        run: python -m pytest tests/test_timer_ubuntu.py -q
      - name: Bound guest reuse, Ubuntu runtime and native SQL
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          python scripts/experiment_disk.py --work-dir "$RUNNER_TEMP/timer-confirmation" --min-free-gib 6 --budget-gib 12 --timeout 2700 -- python tests/timer_runtime/ubuntu.py --work "$RUNNER_TEMP/timer-confirmation" --output "$RUNNER_TEMP/timer-evidence" --source-commit "$GITHUB_SHA" --native-container "$NATIVE_CONTAINER"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: timer-ubuntu-native-${{ github.sha }}
          path: ${{ runner.temp }}/timer-evidence
          if-no-files-found: error
          retention-days: 14

name: Prepared output public integration
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  public-integration:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: go1.26.10
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Bind source and installed guest
        run: |
          mkdir -p build/output-public
          python scripts/git_identity.py inspect HEAD > build/output-public/source.json
          python -c 'import json,os;assert json.load(open("build/output-public/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          python scripts/verify_generated_runtime.py > build/output-public/generated.txt
          python -m pip install -r tests/routing_acceptance/unit-requirements.txt mysql-connector-python==26.7.0
          go clean -testcache
      - name: Existing public integration and prepared consumers
        run: python scripts/verify.py integration > build/output-public/integration.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: output-public-${{ matrix.runner }}-${{ github.sha }}
          path: build/output-public
          if-no-files-found: error
          retention-days: 14

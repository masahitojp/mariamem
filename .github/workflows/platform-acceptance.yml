name: Clean native platform acceptance
on:
  workflow_dispatch:
    inputs:
      candidate_sha256:
        description: SHA256 of the newly generated macOS 15 native archive
        required: true
        type: string
      module_revision:
        description: Public Go module commit (empty means this workflow commit)
        required: false
        type: string
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Obtain private candidate
        env:
          CANDIDATE_URL: ${{ secrets.MARIAMEM_ACCEPTANCE_ARCHIVE_URL }}
        run: |
          test -n "$CANDIDATE_URL" || { echo 'Missing private candidate URL secret'; exit 1; }
          mkdir -p "$RUNNER_TEMP/mariamem-input" "$RUNNER_TEMP/mariamem-evidence"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$CANDIDATE_URL" -o "$RUNNER_TEMP/mariamem-input/mariamem-native-darwin-arm64.tar.gz"
      - name: External consumer acceptance
        env:
          EXPECTED_SHA256: ${{ inputs.candidate_sha256 }}
          MODULE_REVISION: ${{ inputs.module_revision || github.sha }}
        run: |
          python3 scripts/platform_acceptance.py \
            --archive "$RUNNER_TEMP/mariamem-input/mariamem-native-darwin-arm64.tar.gz" \
            --sha256 "$EXPECTED_SHA256" \
            --module "$MODULE_REVISION" \
            --evidence "$RUNNER_TEMP/mariamem-evidence/acceptance.json"
      - name: Preserve evidence only (never the native archive)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-15-arm64-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/mariamem-evidence/
          if-no-files-found: warn
          retention-days: 14

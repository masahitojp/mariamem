name: Bounded v0.4.2 mmap integration acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: d492e52ff460e4a54e29dbef56645c5788d681dd
          path: build/tooling
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Prepare bounded execution
        run: |
          test "$(uname -m)" = x86_64
          cat /etc/os-release
          python -m pip install setuptools wheel pytest PyMySQL SQLAlchemy
          mkdir -p build/tooling/build "$RUNNER_TEMP/go-cache"
          python build/tooling/scripts/experiment_workspace.py --repo "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/bounded-work" prepare ubuntu-mmap --min-free-gib 16 --budget-gib 6
      - name: Correctness, product acceptance and bounded lifecycle
        env:
          MARIAMEM_TOOLING_REPO: ${{ github.workspace }}/build/tooling
          GOCACHE: ${{ runner.temp }}/go-cache
        run: |
          python build/tooling/scripts/experiment_workspace.py --repo "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/bounded-work" run --timeout 3000 ubuntu-mmap -- python "$GITHUB_WORKSPACE/benchmarks/spikes/mmap-integration/ci.py"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mmap-integration-ubuntu-${{ github.sha }}
          path: ${{ runner.temp }}/bounded-work/ubuntu-mmap/evidence/
          if-no-files-found: error
          retention-days: 14

name: Issue123 layout and owner correctness
on:
  push:
    branches: [experiment/issue123-layout]
    paths:
      - 'benchmarks/staticimage/**'
      - 'benchmarks/staticlayout/**'
      - 'benchmarks/issue123layout/**'
      - 'benchmarks/issue123baseline/**'
      - 'internal/generatedgo/**'
      - '.github/workflows/issue123-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Exact-source bounded constructor and real-DB checks
        run: >-
          python scripts/experiment_disk.py --work-dir build/issue123-layout
          --min-free-gib 8 --budget-gib 6 --timeout 1200 --
          python benchmarks/issue123layout/verify.py --work build/issue123-layout
          --source-commit '${{ github.sha }}' --go-version go1.26.10
      - name: Dispose owned scratch and checksum receipts
        if: always()
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p build/issue123-layout/evidence
          rm -rf build/issue123-layout/temp
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('build/issue123-layout')
          assert not (root/'temp').exists()
          e=root/'evidence'
          (e/'job-status.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'status_before_cleanup':os.environ['PRIOR_JOB_STATUS'],'temp_removed':True},indent=2)+'\n')
          (e/'SHA256SUMS.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(e.iterdir()) if p.is_file() and p.name!='SHA256SUMS.json'},indent=2)+'\n')
          PY
      - name: Preserve exact-source evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: issue123-layout-${{ matrix.os }}-${{ github.sha }}
          path: build/issue123-layout/evidence
          if-no-files-found: error
          retention-days: 14

name: Scoped history wait candidate (UNQUALIFIED)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Bind exact source and build a fresh development guest
        shell: bash
        run: |
          mkdir -p build/wait-notify-ci "$RUNNER_TEMP/wait-notify-guest"
          python3 scripts/git_identity.py inspect HEAD > build/wait-notify-ci/source.json
          python3 -c 'import json,os;assert json.load(open("build/wait-notify-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          docker run --rm --user 0 \
            --env GITHUB_SHA --env GITHUB_REF_NAME \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/wait-notify-guest:/out" --workdir /src \
            ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 \
            bash -euxc '
              sed -i "s|http://ports.ubuntu.com/ubuntu-ports|http://azure.ports.ubuntu.com/ubuntu-ports|g" /etc/apt/sources.list.d/ubuntu.sources
              apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
              git config --global --add safe.directory /src
              python3 scripts/build_generated_guest.py --development-output /out/input
            ' > build/wait-notify-ci/build.log 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: scoped-wait-development-guest-${{ github.sha }}
          path: ${{ runner.temp }}/wait-notify-guest/input
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: scoped-wait-build-record-${{ github.sha }}
          path: build/wait-notify-ci
          if-no-files-found: error
          retention-days: 14

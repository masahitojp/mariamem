name: Dictionary wait product input (UNQUALIFIED bootstrap)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fixed builder with runner network; one UNQUALIFIED guest build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dict-product/evidence"
          {
            cat /etc/resolv.conf
            if timeout 20 getent ahosts ports.ubuntu.com; then
              echo 'original archive DNS resolved'
            else
              echo 'original archive DNS unavailable'
            fi
            timeout 20 getent ahosts azure.ports.ubuntu.com
          } > "$RUNNER_TEMP/dict-product/evidence/runner-dns.txt" 2>&1
          docker run --rm -i --network host --user 0:0 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP/dict-product:/dict-product" \
            -w "$GITHUB_WORKSPACE" \
            -e GITHUB_SHA -e GITHUB_WORKSPACE -e HOME=/root \
            -e MARIAMEM_PHASE_TRACE=/dict-product/evidence/guest-phases.jsonl \
            ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 \
            bash -seuo pipefail <<'BUILD' 2>&1 | tee "$RUNNER_TEMP/dict-product/evidence/bootstrap.txt"
          cat /etc/resolv.conf > /dict-product/evidence/builder-dns.txt
          timeout 20 getent ahosts azure.ports.ubuntu.com >> /dict-product/evidence/builder-dns.txt
          # Same Ubuntu archive/signing keys through its Azure-facing name.
          cp /etc/apt/sources.list.d/ubuntu.sources /dict-product/evidence/ubuntu.sources.before
          grep -Fq 'http://ports.ubuntu.com/ubuntu-ports' /etc/apt/sources.list.d/ubuntu.sources
          sed -i 's|http://ports.ubuntu.com/ubuntu-ports|http://azure.ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources /dict-product/evidence/ubuntu.sources.after
          apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /dict-product/evidence
          python3 scripts/git_identity.py inspect HEAD > /dict-product/evidence/source.json
          python3 -c 'import json,os;assert json.load(open("/dict-product/evidence/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          test ! -e guest/experimental.patch
          python3 -m unittest discover -s tests -p test_dictionary_wait_source.py -v
          python3 -m unittest discover -s tests -p test_uca_copy_source.py -v
          python3 scripts/build_generated_guest.py --development-output /dict-product/guest > /dict-product/evidence/build.txt 2>&1
          python3 scripts/check_dictionary_wait_source.py --guest-dir /dict-product/guest --output /dict-product/evidence/assessment.json
          BUILD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dict-product-unqualified-guest-${{ github.sha }}
          path: ${{ runner.temp }}/dict-product/guest
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: dict-product-build-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/dict-product/evidence
          if-no-files-found: warn
          retention-days: 14

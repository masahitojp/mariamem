name: Canonical history wait acceptance (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Bind exact source and build two independent canonical guests
        shell: bash
        run: |
          mkdir -p build/history-wait-ci "$RUNNER_TEMP/history-wait-guest"
          python3 scripts/git_identity.py inspect HEAD > build/history-wait-ci/source.json
          python3 -c 'import json,os;assert json.load(open("build/history-wait-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          test ! -e guest/experimental.patch
          docker run --rm --user 0 \
            --env GITHUB_SHA --env GITHUB_REF_NAME \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/history-wait-guest:/out" --workdir /src \
            ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 \
            bash -euxc '
              sed -i "s|http://ports.ubuntu.com/ubuntu-ports|http://azure.ports.ubuntu.com/ubuntu-ports|g" /etc/apt/sources.list.d/ubuntu.sources
              apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
              git config --global --add safe.directory /src
              python3 scripts/build_generated_guest.py --repetitions 2
              cp /work/artifact/mariamem-legacy-eh.wasm build/generated-release/linked.wasm
              /root/.wasixcc/binaryen/bin/wasm-opt -O2 --enable-threads --enable-mutable-globals --enable-bulk-memory --enable-bulk-memory-opt --enable-exception-handling --enable-simd --enable-relaxed-simd --enable-extended-const --symbolmap=build/generated-release/function.map /work/artifact/mariamem-legacy-eh.wasm -o build/generated-release/mapped.wasm
              cmp build/generated-release/mariamem.wasm build/generated-release/mapped.wasm
              cp -a build/generated-release /out/input
            ' > build/history-wait-ci/build.log 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: history-wait-canonical-guest-${{ github.sha }}
          path: ${{ runner.temp }}/history-wait-guest/input
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: history-wait-build-record-${{ github.sha }}
          path: build/history-wait-ci
          if-no-files-found: error
          retention-days: 14
  native:
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: go1.26.11
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: history-wait-canonical-guest-${{ github.sha }}
          path: build/generated-release
      - name: Exact source and native environment
        shell: bash
        run: |
          mkdir -p build/history-wait-ci
          python scripts/git_identity.py inspect HEAD > build/history-wait-ci/source.json
          python -c 'import json,os;assert json.load(open("build/history-wait-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          test ! -e guest/experimental.patch
          python -c 'import platform,os;expected=("Darwin","arm64") if os.environ["RUNNER_OS"]=="macOS" else ("Linux","x86_64");assert (platform.system(),platform.machine())==expected'
          python -m pip install pytest==9.1.1 -r tests/routing_acceptance/unit-requirements.txt mysql-connector-python==26.7.0
          go clean -testcache
          python -m unittest discover -s tests -p test_dictionary_wait_source.py -v > build/history-wait-ci/dictionary-source.txt 2>&1
      - name: Independent canonical Go regeneration and exact build guards
        run: |
          python scripts/regenerate_release_guest.py --output "$RUNNER_TEMP/history-wait-regeneration" > build/history-wait-ci/regeneration.txt 2>&1
          python -c 'import os,sys;sys.path.insert(0,"scripts");from common import ROOT;from generated_release import verify_build;verify_build(ROOT,os.environ["GITHUB_SHA"])' > build/history-wait-ci/build-guard.txt 2>&1
          python scripts/check_prepared_build_guards.py --output build/history-wait-ci/build-negative.json > build/history-wait-ci/build-negative.txt 2>&1
      - name: Current canonical daily source and runtime checks
        run: python scripts/verify.py check --profile daily > build/history-wait-ci/check.txt 2>&1
      - name: Current full relevant runtime acceptance and attribution
        run: |
          go build -p 1 -trimpath -o build/history-wait-ci/mariamem-host ./cmd/mariamem-host
          python scripts/verify.py integration --host "$GITHUB_WORKSPACE/build/history-wait-ci/mariamem-host" > build/history-wait-ci/integration.txt 2>&1
          python scripts/audit_generated_licenses.py --guest build/generated-release/mariamem.wasm --linked build/generated-release/linked.wasm --function-map build/generated-release/function.map --host build/history-wait-ci/mariamem-host --output build/history-wait-ci/license-audit.json > build/history-wait-ci/license-audit.txt 2>&1
      - name: Bind compact receipt checksums
        run: |
          python -c 'import hashlib,json,pathlib,os,platform;d=pathlib.Path("build/history-wait-ci");guest=json.load(open("build/generated-release/guest.json"));(d/"acceptance.json").write_text(json.dumps(dict(result="PASS",source_commit=os.environ["GITHUB_SHA"],run_id=os.environ["GITHUB_RUN_ID"],platform=platform.platform(),machine=platform.machine(),guest_sha256=guest["guest_sha256"],independent_builds=len(guest["repetitions"]),checks=["canonical regeneration","exact build and negative guards","current daily source/runtime","full relevant integration","actual retained symbol audit"]),indent=2)+"\n");(d/"SHA256SUMS.json").write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(d.iterdir()) if p.suffix in (".txt",".json") and p.name!="SHA256SUMS.json"},indent=2)+"\n")'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: history-wait-native-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/history-wait-ci/*.txt
            build/history-wait-ci/*.json
          if-no-files-found: error
          retention-days: 14

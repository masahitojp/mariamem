name: Guest build boundary verification
on:
  workflow_dispatch:
    inputs:
      lifecycle_measurement:
        description: 'Measure opt-in guest startup stages (20 samples, no performance gates)'
        type: boolean
        default: false
      restore_attribution:
        description: "Prepared keys + validation reuse: paired restore instrumentation attribution"
        type: boolean
        default: false
      prepared_validation_experiment:
        description: "Paired within-call validation reuse with prepared RSA keys, no memory diagnostics"
        type: boolean
        default: false
      auth_key_experiment:
        description: "Experimental paired RSA generation vs prepared keys (experiment branch only)"
        type: boolean
        default: false
      plugin_measurement:
        description: 'Focused plugin/cache attribution, 1000 rows, Go Fork 1/4/8'
        type: boolean
        default: false
      initialization_measurement:
        description: 'MariaDB init/CPU/file/memory probe, two fixtures and disposable validation reuse'
        type: boolean
        default: false

# Focused source/WASM/AOT verification; no release review or publication.
permissions:
  contents: read

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Resolve guest input identity
        id: guest-key
        run: echo "key=$(python scripts/benchmark_artifacts.py key wasm)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: guest-cache
        with:
          path: build/guest-wasm
          key: ${{ steps.guest-key.outputs.key }}
      - name: Install native host-tool dependencies (cache miss)
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: bash scripts/install_guest_host_tools.sh
      - name: Build and seal guest WASM (cache miss)
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/install_guest_toolchain.py
          python scripts/prepare_guest.py
          python scripts/build_guest_wasm.py --jobs 3
          python scripts/benchmark_artifacts.py seal wasm
      - name: Verify guest identity and bytes
        run: |
          python scripts/benchmark_artifacts.py verify wasm
          echo 'Guest WASM: ${{ steps.guest-cache.outputs.cache-hit == 'true' && 'REUSED' || 'REBUILT' }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: steps.guest-cache.outputs.cache-hit != 'true'
        with:
          path: build/guest-wasm
          key: ${{ steps.guest-key.outputs.key }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: guest-wasm-${{ github.sha }}
          path: build/guest-wasm/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: guest-build-log-${{ github.sha }}
          path: build/guest-wasm-build.log
          if-no-files-found: warn
          retention-days: 14

  macos:
    if: ${{ !inputs.initialization_measurement && !inputs.plugin_measurement && !inputs.auth_key_experiment && !inputs.prepared_validation_experiment && !inputs.restore_attribution }}
    needs: guest
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: guest-wasm-${{ github.sha }}
          path: build/guest-wasm/
      - name: Resolve platform AOT identity
        id: aot-key
        run: echo "key=$(python scripts/benchmark_artifacts.py key aot --target darwin-arm64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: aot-cache
        with:
          path: build/guest-aot
          key: ${{ steps.aot-key.outputs.key }}
      - name: AOT compile and seal (cache miss)
        if: steps.aot-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/compile_guest_aot.py --wasm-dir build/guest-wasm --benchmark-input-reuse
          python scripts/benchmark_artifacts.py seal aot --target darwin-arm64
      - name: Verify platform AOT identity and bytes
        run: |
          python scripts/benchmark_artifacts.py verify aot --target darwin-arm64
          echo 'AOT darwin-arm64: ${{ steps.aot-cache.outputs.cache-hit == 'true' && 'REUSED' || 'REBUILT' }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: steps.aot-cache.outputs.cache-hit != 'true'
        with:
          path: build/guest-aot
          key: ${{ steps.aot-key.outputs.key }}
      - name: Minimal real MariaDB smoke
        run: |
          go run ./scripts/guest_smoke "$GITHUB_WORKSPACE/build/guest-aot"
          {
            echo '## Guest build boundary: PASS'
            echo 'Source: `${{ github.sha }}`'
            echo 'Linux x86_64 WASM provenance: `guest-wasm-${{ github.sha }}`'
            echo 'macOS arm64 AOT provenance: `guest-aot-${{ github.sha }}`'
            echo 'Start / SELECT 1 / Close: PASS'
            echo 'Verification only; nothing was published.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Measure packaged guest startup stages
        if: inputs.lifecycle_measurement
        run: |
          python -m pip install setuptools wheel
          python scripts/build_alpha.py --ci-candidate --runtime build/guest-aot/wasmer-headless --module build/guest-aot/mariamem.wasmu
          python -m venv "$RUNNER_TEMP/stage-venv"
          version=$(python -c "import sys; sys.path.insert(0, 'scripts'); from release_version import PYTHON_VERSION; print(PYTHON_VERSION)")
          "$RUNNER_TEMP/stage-venv/bin/python" -m pip install "build/dist/mariamem-${version}-py3-none-macosx_15_0_arm64.whl" PyMySQL
          unset MARIAMEM_NATIVE_DIR PYTHONPATH
          "$RUNNER_TEMP/stage-venv/bin/python" scripts/verify.py bench isolation \
            --guest-stage-timing --runs 20 --warmup 2 --workers 1 4 8 --rows 1000 --queries 100 \
            --json benchmarks/results/guest-startup-stages.json
          native_dir=$("$RUNNER_TEMP/stage-venv/bin/python" -c "import pathlib, mariamem; print(pathlib.Path(mariamem.__file__).parent / '_native')")
          "$RUNNER_TEMP/stage-venv/bin/python" scripts/verify.py bench go-isolation \
            --native-dir "$native_dir" --guest-stage-timing --runs 20 --warmup 2 --workers 1 4 8 --rows 1000 --queries 100 \
            --json benchmarks/results/go-startup-stages.json
          python benchmarks/stage_report.py benchmarks/results/go-startup-stages.json > benchmarks/results/go-startup-stages.md
          cat benchmarks/results/go-startup-stages.md >> "$GITHUB_STEP_SUMMARY"
          python benchmarks/stage_report.py benchmarks/results/guest-startup-stages.json > benchmarks/results/guest-startup-stages.md
          cat benchmarks/results/guest-startup-stages.md >> "$GITHUB_STEP_SUMMARY"
          python benchmarks/compare_baselines.py benchmarks/results/go-startup-stages.json benchmarks/results/guest-startup-stages.json > benchmarks/results/go-python-comparison.md
          cat benchmarks/results/go-python-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && inputs.lifecycle_measurement
        with:
          name: guest-startup-stages-${{ github.sha }}
          path: |
            benchmarks/results/guest-startup-stages.json
            benchmarks/results/guest-startup-stages.md
            benchmarks/results/go-startup-stages.json
            benchmarks/results/go-startup-stages.md
            benchmarks/results/go-python-comparison.md
            build/guest-aot/provenance.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: guest-aot-${{ github.sha }}
          path: build/guest-aot/provenance.json
          if-no-files-found: warn
          retention-days: 14

  initialization:
    if: inputs.initialization_measurement || inputs.plugin_measurement || inputs.auth_key_experiment || inputs.prepared_validation_experiment || inputs.restore_attribution
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: ubuntu24.04-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: guest-wasm-${{ github.sha }}
          path: build/guest-wasm/
      - name: Resolve platform AOT identity
        id: aot-key
        run: echo "key=$(python scripts/benchmark_artifacts.py key aot --target ${{ matrix.platform }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: aot-cache
        with:
          path: build/guest-aot
          key: ${{ steps.aot-key.outputs.key }}
      - name: AOT compile and seal (cache miss)
        if: steps.aot-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/compile_guest_aot.py --wasm-dir build/guest-wasm --benchmark-input-reuse
          python scripts/benchmark_artifacts.py seal aot --target ${{ matrix.platform }}
      - name: Verify platform AOT identity and bytes
        run: |
          python scripts/benchmark_artifacts.py verify aot --target ${{ matrix.platform }}
          echo 'AOT ${{ matrix.platform }}: ${{ steps.aot-cache.outputs.cache-hit == 'true' && 'REUSED' || 'REBUILT' }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: steps.aot-cache.outputs.cache-hit != 'true'
        with:
          path: build/guest-aot
          key: ${{ steps.aot-key.outputs.key }}
      - name: Minimal verified guest smoke
        run: go run ./scripts/guest_smoke "$GITHUB_WORKSPACE/build/guest-aot"
      - name: Restore attribution (same keys and validation reuse in both conditions)
        if: inputs.restore_attribution
        run: |
          python benchmarks/prepared_validation_reuse.py --native-dir build/guest-aot --output benchmarks/results/init-restore --pairs 20 --warmup 2 --restore-attribution
          python scripts/benchmark_artifacts.py verify aot --target ${{ matrix.platform }}
          cat benchmarks/results/init-restore/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Prepared-key paired validation reuse
        if: inputs.prepared_validation_experiment
        run: |
          python benchmarks/prepared_validation_reuse.py --native-dir build/guest-aot --output benchmarks/results/init-prepared-validation --pairs 20 --warmup 2
          python scripts/benchmark_artifacts.py verify aot --target ${{ matrix.platform }}
          cat benchmarks/results/init-prepared-validation/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Paired authentication-key experiment
        if: inputs.auth_key_experiment
        run: |
          python benchmarks/prepared_auth_keys.py --native-dir build/guest-aot --output benchmarks/results/init-auth-keys --pairs 20 --warmup 2
          python scripts/benchmark_artifacts.py verify aot --target ${{ matrix.platform }}
          cat benchmarks/results/init-auth-keys/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Focused plugin/cache attribution
        if: inputs.plugin_measurement
        run: |
          python scripts/verify.py bench go-isolation --native-dir build/guest-aot \
            --init-diagnostics --runs 20 --warmup 2 --workers 1 4 8 --rows 1000 \
            --json benchmarks/results/init-plugins.json
          python benchmarks/init_report.py benchmarks/results/init-plugins.json > benchmarks/results/init-plugins.md
          cat benchmarks/results/init-plugins.md >> "$GITHUB_STEP_SUMMARY"
      - name: Canonical Go control (diagnostics off)
        if: inputs.initialization_measurement
        run: |
          python scripts/verify.py bench go-isolation --native-dir build/guest-aot \
            --guest-stage-timing --runs 20 --warmup 2 --workers 1 4 8 --rows 1000 \
            --json benchmarks/results/init-control.json
      - name: Initialization attribution and fixture sensitivity
        if: inputs.initialization_measurement
        run: |
          for rows in 1000 100000; do
            python scripts/verify.py bench go-isolation --native-dir build/guest-aot \
              --init-diagnostics --memory-diagnostics --runs 20 --warmup 2 --workers 1 4 8 --rows "$rows" \
              --json "benchmarks/results/init-${rows}.json"
            python benchmarks/init_report.py "benchmarks/results/init-${rows}.json" > "benchmarks/results/init-${rows}.md"
            cat "benchmarks/results/init-${rows}.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Disposable within-call validation reuse (no production patch)
        if: inputs.initialization_measurement
        run: |
          python benchmarks/validation_reuse.py --native-dir build/guest-aot \
            --guest-stage-timing --runs 20 --warmup 2 --workers 1 4 8 --rows 1000 \
            --json benchmarks/results/init-validation-reuse.json
          python benchmarks/stage_report.py benchmarks/results/init-validation-reuse.json > benchmarks/results/init-validation-reuse.md
          cat benchmarks/results/init-validation-reuse.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: initialization-${{ matrix.platform }}-${{ github.sha }}
          path: |
            benchmarks/results/init-*
            build/guest-aot/provenance.json
            build/guest-aot/manifest.json
          if-no-files-found: warn
          retention-days: 30

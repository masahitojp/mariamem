name: Buffer alignment canonical candidate (not Release Qualification)
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate commit (bounded alignment check, no publication)
        type: string
        required: true
permissions:
  contents: read
env:
  CANDIDATE: ${{ inputs.candidate_ref }}
concurrency:
  group: alignment-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - name: Source builder prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Freeze canonical source (the builder checks the prepared allocator)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test ! -e guest/experimental.patch
          mkdir -p build/alignment-ci
          python3 scripts/git_identity.py inspect HEAD > build/alignment-ci/source.json
      - name: Two independent canonical source builds
        run: |
          sudo -H -E "$(command -v python)" scripts/build_generated_guest.py --repetitions 2 > build/alignment-ci/guest-build.log 2>&1
          sudo cp /work/artifact/mariamem-legacy-eh.wasm build/generated-release/linked.wasm
          sudo /root/.wasixcc/binaryen/bin/wasm-opt -O2 --enable-threads --enable-mutable-globals --enable-bulk-memory --enable-bulk-memory-opt --enable-exception-handling --enable-simd --enable-relaxed-simd --enable-extended-const --symbolmap=build/generated-release/function.map /work/artifact/mariamem-legacy-eh.wasm -o build/generated-release/mapped.wasm
          sudo chown -R "$(id -u):$(id -g)" build
          cmp build/generated-release/mapped.wasm build/generated-release/mariamem.wasm
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: alignment-guest-${{ github.sha }}
          path: build/generated-release
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: alignment-source-${{ github.sha }}
          path: |
            build/alignment-ci
            build/buffer-pool-contract-*.json
          retention-days: 14
  native:
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: alignment-guest-${{ github.sha }}
          path: build/generated-release
      - name: Native prerequisites and exact input binding
        run: |
          python -m pip install --no-cache-dir -r tests/routing_acceptance/unit-requirements.txt mysql-connector-python==26.7.0
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          go clean -testcache
          mkdir -p build/alignment-ci
          python tests/v06_prepared_connector_environment.py --output build/alignment-ci/connector-environment.json
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          expected = 'arm64' if platform.system() == 'Darwin' else 'x86_64'
          assert platform.machine() == expected
          g = json.loads(Path('build/generated-release/guest.json').read_text())
          assert g['source_commit'] == os.environ['GITHUB_SHA']
          assert g['contract'] == 'generated-go-v1'
          assert len(g['repetitions']) == 2 and g['repetitions'][0] == g['repetitions'][1]
          assert not g['prepared_source'].get('experimental_patch')
          PY
      - name: Reproduce every canonical generated byte
        run: |
          python scripts/regenerate_release_guest.py > build/alignment-ci/regeneration.log 2>&1
          python scripts/verify_generated_runtime.py
      - name: Exact worker/data binding and existing J1 controls
        run: |
          python tests/check_prepared_p1_binding.py --runtime internal/generatedgo
          python tests/routine_thread_fixture.py --output build/alignment-ci/j1 --run
      - name: Runtime correctness and existing failure controls
        run: python scripts/verify.py integration > build/alignment-ci/integration.log 2>&1
      - name: Clean-source license and build provenance
        run: |
          go build -p 1 -trimpath -o build/alignment-ci/mariamem-host ./cmd/mariamem-host
          python scripts/audit_generated_licenses.py --guest build/generated-release/mariamem.wasm --linked build/generated-release/linked.wasm --function-map build/generated-release/function.map --host build/alignment-ci/mariamem-host --output build/alignment-ci/license-audit.json
          python scripts/check_prepared_build_guards.py --output build/alignment-ci/build-guards.json > build/alignment-ci/build-guards.log 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: alignment-native-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/alignment-ci/*.json
            build/alignment-ci/*.log
            build/alignment-ci/j1/*.json
            build/alignment-ci/j1/*.txt
            build/generated-release/regeneration.json
          if-no-files-found: error
          retention-days: 14

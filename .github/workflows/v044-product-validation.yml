name: v0.4.4 product validation
on:
  push:
    branches: [experiment/v044-product-contract]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact remotely fetchable candidate SHA (no publication)
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    name: Product contract — ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: ubuntu24.04-x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0
      - name: Freeze candidate identity and native platform
        env:
          CANDIDATE: ${{ inputs.candidate_ref || github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          case "$PLATFORM" in
            darwin-arm64) test "$(uname -m)" = arm64 ;;
            ubuntu24.04-x86_64) test "$(uname -m)" = x86_64 ;;
          esac
          echo "CANDIDATE_SHA=$CANDIDATE" >> "$GITHUB_ENV"
          echo "VALIDATION=$RUNNER_TEMP/v044-product-validation" >> "$GITHUB_ENV"
          echo "Candidate: $CANDIDATE; baseline v0.4.3 commit: c8bd25a56e9d5221abaf40b2c98102bd60c217ae" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install deterministic validation dependencies
        run: python -m pip install --no-cache-dir setuptools==80.9.0 wheel==0.45.1 pytest==8.4.2 pytest-xdist==3.8.0 PyMySQL==1.2.3
      - name: Correctness, independence, lifecycle and installed pytest
        run: |
          python scripts/validate_product_candidate.py --candidate-sha "$CANDIDATE_SHA" \
            --workspace "$VALIDATION" --disposable-checkout --phase correctness
      - name: Exact v0.4.3 comparison and FD scaling after correctness
        run: |
          python scripts/validate_product_candidate.py --candidate-sha "$CANDIDATE_SHA" \
            --workspace "$VALIDATION" --disposable-checkout --phase performance
      - name: Upload compact decision evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: v044-product-${{ matrix.platform }}-${{ inputs.candidate_ref || github.sha }}
          path: ${{ runner.temp }}/v044-product-validation/evidence
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable scratch after interruption
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import runpy
          path=Path(os.environ['RUNNER_TEMP'])/'v044-product-validation'/'scratch'
          if path.exists():
              cleanup=runpy.run_path('scripts/validate_product_candidate.py')['remove_disposable_tree']
              cleanup(path)

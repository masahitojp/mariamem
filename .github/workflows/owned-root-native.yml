name: Owned-root bounded native verification
on:
  push:
    branches: [experiment/snapshot-owned-root-guest]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Exact source, native platform and inputs
        run: |
          mkdir -p build/owned-root-native/evidence
          python scripts/git_identity.py inspect HEAD > build/owned-root-native/evidence/source.json
          python -c 'import json,os;assert json.load(open("build/owned-root-native/evidence/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          python -c 'import platform;assert platform.system()=="Linux" and platform.machine()=="x86_64";d=dict(s.split("=",1) for s in open("/etc/os-release").read().splitlines() if "=" in s);assert d["ID"].strip(chr(34))=="ubuntu" and d["VERSION_ID"].strip(chr(34))=="24.04"'
          uname -a > build/owned-root-native/evidence/platform.txt
          go version >> build/owned-root-native/evidence/platform.txt
          python --version >> build/owned-root-native/evidence/platform.txt
          test -z "$(git status --porcelain)"
          python -m pip install 'pytest>=7' 'PyMySQL>=1.1,<2'
          go mod download
      - name: Canonical source and licensing
        run: python benchmarks/spikes/ownedroot-guest/check.py source --workspace build/owned-root-native
      - name: Storage ownership and strict oracles under race detector
        run: >-
          python scripts/experiment_disk.py --work-dir build/owned-root-native
          --min-free-gib 8 --budget-gib 8 --timeout 1200 --
          python benchmarks/spikes/ownedroot-guest/check.py focused --workspace build/owned-root-native
      - name: Go SQL, isolation, lifecycle and public boundaries
        env:
          MARIAMEM_TEST_DEFAULT: '1'
        run: |
          python benchmarks/spikes/ownedroot-guest/check.py integration --workspace build/owned-root-native
          python benchmarks/spikes/ownedroot-guest/check.py public --workspace build/owned-root-native
      - name: Python shared host and strict handoff
        run: python benchmarks/spikes/ownedroot-guest/check.py python --workspace build/owned-root-native
      - name: Mapped child to new baseline
        run: python benchmarks/spikes/ownedroot-guest/check.py mapped --workspace build/owned-root-native
      - name: Isolated pre-acquisition page corruption characterization
        run: python benchmarks/spikes/ownedroot-guest/corruption.py build/owned-root-native
      - name: Preserve stage receipts and raw outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: owned-root-ubuntu-${{ github.sha }}
          path: build/owned-root-native/evidence
          if-no-files-found: error

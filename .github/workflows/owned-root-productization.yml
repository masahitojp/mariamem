name: Owned-root productization development checks
on:
  push:
    branches: [experiment/snapshot-owned-root-productization]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: ubuntu24.04-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      GOTOOLCHAIN: go1.26.10
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Exact source and platform
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p build/owned-root-productization-evidence
          python scripts/git_identity.py inspect HEAD > build/owned-root-productization-evidence/source.json
          python -c 'import json,os;assert json.load(open("build/owned-root-productization-evidence/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          python -c 'import os,platform;p=os.environ["EXPECTED_PLATFORM"];assert (platform.system(),platform.machine())==({"darwin-arm64":("Darwin","arm64"),"ubuntu24.04-x86_64":("Linux","x86_64")}[p])'
          test -z "$(git status --porcelain)"
          uname -a > build/owned-root-productization-evidence/platform.txt
          go version >> build/owned-root-productization-evidence/platform.txt
          python --version >> build/owned-root-productization-evidence/platform.txt
          python -m pip install 'pytest>=7' 'PyMySQL>=1.1,<2'
      - name: Canonical development check
        run: python scripts/verify.py check > build/owned-root-productization-evidence/check.txt 2>&1
      - name: Canonical runtime and consumer integration
        run: python scripts/verify.py integration > build/owned-root-productization-evidence/integration.txt 2>&1
      - name: Preserve exact-source development evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: owned-root-productization-${{ matrix.platform }}-${{ github.sha }}
          path: build/owned-root-productization-evidence
          if-no-files-found: error

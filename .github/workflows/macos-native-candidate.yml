name: macOS native candidate acceptance
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit resolved by Release CI
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    concurrency:
      group: release-candidate-macos
      queue: max
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: go1.26.11
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Require exact source and native arm64
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(go env GOHOSTARCH)" = arm64
          python scripts/git_identity.py inspect HEAD
          python scripts/verify_generated_runtime.py
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - name: Build one immutable release wheel
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python scripts/build_alpha.py --ci-candidate --release-wheel
      - name: Darwin memory mappings, initial image and Snapshot ownership
        run: |
          go test -count=1 -timeout=8m ./internal/generatedgo/code/base ./internal/generatedgo/image ./internal/snapshot
      - name: Accept the installed wheel and external Go module
        run: |
          wheel="$(python -c 'import json; print(json.load(open("tests/evidence/alpha-wheel.json"))["wheel"])')"
          python scripts/native_candidate_acceptance.py --target darwin-arm64 --wheel "$wheel" --output build/macos-boundary/acceptance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: macos-boundary-${{ inputs.source_commit }}
          overwrite: ${{ github.run_attempt > 1 }}
          path: |
            build/macos-boundary/acceptance.json
            build/dist/*.whl
            tests/evidence/alpha-wheel.json
          if-no-files-found: error
          retention-days: 14

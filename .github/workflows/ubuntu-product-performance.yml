name: Ubuntu released-product performance
on:
  push:
    branches: [experiment/ubuntu-product-performance]
    paths:
      - '.github/workflows/ubuntu-product-performance.yml'
      - 'benchmarks/ubuntu-product/**'
      - 'tests/test_ubuntu_product_performance.py'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
      PERFORMANCE: ${{ runner.temp }}/ubuntu-product-performance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.8'
      - name: Measurement tooling and exact harness source
        run: |
          python -c 'import os,subprocess;from scripts.git_identity import require_commit;require_commit(".",os.environ["GITHUB_SHA"]);assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["GITHUB_SHA"];assert not subprocess.check_output(["git","status","--porcelain"])'
          python -m unittest discover -s tests -p test_ubuntu_product_performance.py -v
          python -m pip install --no-cache-dir -r benchmarks/main-product-evidence/results/python-dependencies.txt
      - name: Fixed-input serial performance campaign (not Qualification)
        run: python benchmarks/ubuntu-product/run.py --workspace "$PERFORMANCE"
      - name: Remove owned build trees and caches
        if: always()
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from experiment_workspace import remove_disposable_tree
          # This job alone owns these cloned inputs, binaries and scratch.
          # Source refs are fetched above; compact results live outside temp.
          remove_disposable_tree(Path(os.environ['PERFORMANCE']) / 'temp')
      - name: Preserve all compact performance evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubuntu-product-performance-${{ github.sha }}
          path: ${{ runner.temp }}/ubuntu-product-performance/evidence
          if-no-files-found: error
          retention-days: 90

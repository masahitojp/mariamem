name: Django standard runner recipe
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit resolved by Release CI
        required: true
        type: string
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    services:
      mariadb:
        image: mariadb@sha256:2f4f46f80e7251990bfdc601ae3f7f2964ddb4dc1868f7deca699fc1ece8c35e
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3307:3306']
        options: --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned framework and native client
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          mkdir -p build/django-native
          python -m pip install --no-cache-dir --report build/django-native/dependencies.json -r tests/django_lifecycle/requirements.txt
      - name: Existing exact native input guard
        env:
          NATIVE_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          python scripts/git_identity.py inspect HEAD
          python tests/dump_import_acceptance/linux_acquisition.py --container "$NATIVE_CONTAINER" --expected-source-commit "$SOURCE_COMMIT" --output build/django-native/acquisition
      - name: Fresh standard lifecycle and failed-migration reference
        run: python scripts/experiment_disk.py --work-dir build --min-free-gib 4 --budget-gib 4 --timeout 900 -- python tests/django_lifecycle/ci.py --route native --native-port 3307 --acquisition build/django-native/acquisition --expected-source-commit "$SOURCE_COMMIT" --output build/django-native/reference
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: django-native-${{ matrix.python }}-${{ inputs.source_commit }}
          path: build/django-native
          if-no-files-found: error
  recipe:
    needs: native
    runs-on: ${{ matrix.os }}
    # One host build plus both 20-minute case budgets; individual deadlines stay fixed.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/django-lifecycle.yml
      - name: Share Go compiler cache and discard restored test results
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          go clean -testcache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: py311
        with:
          python-version: '3.11'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: py314
        with:
          python-version: '3.14'
      - name: Native client headers and pinned frameworks
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          else
            brew install pkgconf mariadb-connector-c
            export PKG_CONFIG_PATH="$(brew --prefix mariadb-connector-c)/lib/pkgconfig"
          fi
          for py in "$PY311" "$PY314"; do
            version=$("$py" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            mkdir -p "build/django-evidence/py$version"
            "$py" -m pip install --no-cache-dir --report "build/django-evidence/py$version/dependencies.json" -r tests/django_lifecycle/requirements.txt
          done
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: django-native-3.11-${{ inputs.source_commit }}
          path: build/django-reference/py3.11
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: django-native-3.14-${{ inputs.source_commit }}
          path: build/django-reference/py3.14
      - name: Pure ownership and receipt mutation checks on both interpreters
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          django_status=0
          for py in "$PY311" "$PY314"; do
            "$py" -m pytest tests/test_django_recipe_unit.py -q -p no:cacheprovider || django_status=1
          done
          exit "$django_status"
      - name: Exact clean source before the single host build
        run: |
          python scripts/git_identity.py inspect HEAD
          python -c 'import sys; sys.path.insert(0,"tests/dump_import_acceptance"); from linux_acquisition import source_identity; import os; source_identity(os.environ["SOURCE_COMMIT"])'
          python scripts/experiment_disk.py --work-dir "$RUNNER_TEMP/django-work" --min-free-gib 4 --budget-gib 8 --timeout 1200 -- go build -p 1 -trimpath -o build/mariamem-host ./cmd/mariamem-host
      - name: Standard runner, mixed orders, original errors and owner disposal on both interpreters
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          django_status=0
          for py in "$PY311" "$PY314"; do
            version=$("$py" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            "$py" scripts/experiment_disk.py --work-dir "$RUNNER_TEMP/django-work" --min-free-gib 4 --budget-gib 8 --timeout 1200 -- "$py" tests/django_lifecycle/ci.py --route guest --host build/mariamem-host --reference "build/django-reference/py$version/reference" --expected-source-commit "$SOURCE_COMMIT" --output "build/django-evidence/py$version/acceptance" || django_status=1
          done
          exit "$django_status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: django-${{ matrix.os }}-${{ inputs.source_commit }}
          path: build/django-evidence
          if-no-files-found: error
      - name: Remove job-owned scratch
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/django-work"

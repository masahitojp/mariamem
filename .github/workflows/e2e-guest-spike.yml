name: E2E guest browser comparison
on:
  push:
    branches: [experiment/e2e-guest-live]
    paths:
      - '.github/workflows/e2e-guest-spike.yml'
      - 'tests/e2e_guest_spike/**'
      - 'tests/test_e2e_guest*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: build/e2e-browsers
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: py311
        with:
          python-version: '3.11'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: py314
        with:
          python-version: '3.14'
      - name: Native client development library
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          else
            brew install pkgconf mariadb-connector-c
            echo "PKG_CONFIG_PATH=$(brew --prefix mariadb-connector-c)/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - name: Source and pinned browser dependencies
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          python scripts/git_identity.py inspect HEAD
          for py in "$PY311" "$PY314"; do
            "$py" -m pip install --no-cache-dir -r tests/e2e_native_control/requirements.lock.txt
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            python -m playwright install --with-deps chromium --only-shell
          else
            python -m playwright install chromium --only-shell
          fi
      - name: Exact source builds
        run: |
          go build -p 1 -trimpath -o build/mariamem-host ./cmd/mariamem-host
          go build -p 1 -trimpath -o build/e2e-go-orders ./tests/e2e_native_control/goapp
          go build -p 1 -trimpath -o build/e2e-go-owner ./tests/e2e_guest_spike/go_owner
      - name: Browser comparison and actual lifecycle defects
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          for py in "$PY311" "$PY314"; do
            version=$("$py" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            "$py" -m pytest tests/test_e2e_guest_relay.py tests/test_e2e_guest_oracles.py tests/test_e2e_native_oracles.py tests/test_e2e_child_diagnostics.py -q
            for scenario in positive skip-reset restart-app; do
              args=()
              if [[ "$scenario" != positive ]]; then args=(--mutation "$scenario"); fi
              "$py" scripts/experiment_disk.py --work-dir build --budget-gib 6 --min-free-gib 4 --timeout 900 -- "$py" tests/e2e_guest_spike/run.py --host build/mariamem-host --go-app build/e2e-go-orders --go-owner build/e2e-go-owner --expected-source-commit "$GITHUB_SHA" --output "build/e2e-guest/py$version/$scenario" "${args[@]}"
            done
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: e2e-guest-${{ matrix.os }}-${{ github.sha }}
          path: build/e2e-guest
          if-no-files-found: error

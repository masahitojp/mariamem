name: Timer product input (not Qualification)
on:
  push:
    branches: [experiment/timer-product]
    paths:
      - guest/source.patch
      - tests/timer_source/**
      - tests/test_timer_source.py
      - .github/workflows/timer-product.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timer-product-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    timeout-minutes: 100
    steps:
      - name: Builder dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build bison pkg-config curl ca-certificates git libssl-dev zlib1g-dev libpcre2-dev libncurses-dev python3 xz-utils
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Exact clean canonical source and timer controls
        env:
          HOME: /root
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p build/timer-product-ci
          python3 scripts/git_identity.py inspect HEAD > build/timer-product-ci/source.json
          python3 -c 'import json,os;assert json.load(open("build/timer-product-ci/source.json"))["source_commit"]==os.environ["GITHUB_SHA"]'
          test -z "$(git status --porcelain)"
          test ! -e guest/experimental.patch
          python3 tests/timer_source/selection.py --work /tmp/timer-selection --output build/timer-product-ci/selection.json > build/timer-product-ci/selection.txt 2>&1
          python3 tests/timer_source/calibration.py --work /tmp/timer-calibration --output build/timer-product-ci/calibration.json > build/timer-product-ci/calibration.txt 2>&1
      - name: Single UNQUALIFIED bootstrap from canonical patch
        env:
          HOME: /root
        run: |
          python3 scripts/build_generated_guest.py --development-output /tmp/timer-product-guest > build/timer-product-ci/build.txt 2>&1
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/timer-product-guest')
          r=json.loads((p/'guest.json').read_text())
          expected='a64b581154d7d1ca2ca8aae9a552c9433f7f1354b7c7f5a36d600b62a32d2c18'
          assert r['contract']=='development-unqualified-v1' and r['result']=='UNQUALIFIED'
          assert r['guest_sha256']==hashlib.sha256((p/'mariamem.wasm').read_bytes()).hexdigest()==expected
          assert len(r['repetitions'])==1 and not r['prepared_source'].get('experimental_patch')
          out=pathlib.Path('build/timer-product-ci')
          (out/'assessment.json').write_text(json.dumps(dict(result='UNQUALIFIED_INPUT_BUILT',source_commit=r['source_identity']['commit'],guest_sha256=expected,guest_record_sha256=hashlib.sha256((p/'guest.json').read_bytes()).hexdigest(),canonical_patch_sha256=hashlib.sha256(pathlib.Path('guest/source.patch').read_bytes()).hexdigest(),independent_source_builds=1,product_runtime='NOT_INSTALLED',qualification=False),indent=2)+'\n')
          (out/'SHA256SUMS.json').write_text(json.dumps({f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(out.iterdir()) if f.is_file()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: timer-product-guest-${{ github.sha }}
          path: /tmp/timer-product-guest
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: timer-product-evidence-${{ github.sha }}
          path: build/timer-product-ci
          if-no-files-found: error
          retention-days: 14
